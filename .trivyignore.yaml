# Vulnerabilities the image scan may skip, each with the reason it is not reachable here and a
# date it must be reconsidered. An entry without both is a suppression nobody can audit.
#
# The gate this feeds is `task scan-image`, which fails on CRITICAL vulnerabilities that HAVE a
# fix — so everything listed here is by definition something a reader would expect to be fixed by
# upgrading. Say why we have not. Reproduce the gate locally with that task before editing this.
#
# The list is deliberately EMPTY, and the file is kept because Trivy treats a missing --ignorefile
# as a fatal error: the gate must not be able to quietly stop honouring its own suppressions.
#
# It held one entry until the image stopped shipping a downloaded SOPS release binary. That entry
# suppressed CVE-2026-56854 (x/crypto/ssh) on the ground that the vulnerable code is an SSH SERVER
# path a CLI never enters — sound, but it was reachability reasoning standing in for a fix that
# upstream had not shipped, and it only ever silenced OUR gate. Anyone scanning the published image
# still saw the finding, along with thirteen others in the same class. SOPS is now built from source
# against a current toolchain (see the Dockerfile's sops-builder stage), which fixes them for
# everyone rather than annotating them for us.
#
# Prefer that shape of fix. Reach for an entry here only when there is genuinely nothing to rebuild.
vulnerabilities: []
