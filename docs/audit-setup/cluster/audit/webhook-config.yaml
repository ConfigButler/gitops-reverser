# Template: replace the CA and client credential placeholders before use.
# Generate them from the release Secrets described by helm get notes.
apiVersion: v1
kind: Config
preferences: {}
clusters:
- name: audit-webhook
  cluster:
    # Replace with a Service IP reachable from every control-plane host.
    server: https://10.43.200.200:9444/audit-webhook/default
    tls-server-name: gitops-reverser-audit.gitops-reverser.svc
    certificate-authority-data: REPLACE_WITH_BASE64_AUDIT_ROOT_CA
contexts:
- name: webhook
  context:
    cluster: audit-webhook
    user: kube-apiserver
current-context: webhook
users:
- name: kube-apiserver
  user:
    client-certificate-data: REPLACE_WITH_BASE64_AUDIT_CLIENT_CERT
    client-key-data: REPLACE_WITH_BASE64_AUDIT_CLIENT_KEY
