apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: shop-configuration
  namespace: shop
spec:
  providerRef:
    name: artifacts-repository
  clusterProviderRef:
    name: app-intent
  branch: main
  path: apps/shop
  allowedSourceNamespaces:
    names: [shop]
  mode: Write
  layout:
    kind: Kustomize
    scope: SingleNamespace
    namespace: shop
    writeNamespace: Never
    kustomize:
      root: .
      create: true
