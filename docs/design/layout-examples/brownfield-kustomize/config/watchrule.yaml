apiVersion: configbutler.ai/v1alpha3
kind: WatchRule
metadata:
  name: demo-content
  namespace: demo
spec:
  targetRef:
    name: demo
  rules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["configmaps", "services"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments"]
