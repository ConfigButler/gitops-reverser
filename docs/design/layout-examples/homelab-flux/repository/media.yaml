apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 30m
  chart:
    spec:
      chart: jellyfin
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
  values:
    persistence:
      config:
        enabled: true
    service:
      type: ClusterIP
