apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: argocd-applications
  namespace: argocd
spec:
  providerRef:
    name: homelab-repository
  branch: main
  path: bootstrap/argocd-applications
  # Safe here only because the folder's kustomization.yaml supplies
  # namespace: argocd — and that file belongs to the repository owner, not to us.
  # The post-scan pass checks that supplier on every scan, so deleting it turns
  # the target Validated=False rather than silently relocating documents.
  serializeNamespace: false
