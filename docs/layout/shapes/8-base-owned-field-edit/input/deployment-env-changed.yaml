# Abridged live object. Same Deployment, same base document, ONE different field:
# LOG_LEVEL is now debug. There is no kustomize declaration that expresses an env var.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: ghcr.io/example/checkout:1.4.0
          env:
            - name: LOG_LEVEL
              value: debug
