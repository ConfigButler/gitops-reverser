# Required, because the WatchRule beside this file names source namespaces other
# than its own. Two separate grants are needed and they are owned by different
# people: the ClusterProvider (platform admin) delegates the ABILITY to choose a
# source namespace, and the GitTarget (folder owner) says WHICH ones may arrive.
apiVersion: configbutler.ai/v1alpha3
kind: ClusterProvider
metadata:
  name: home
spec:
  allowedNamespaces:
    names: [homelab-config]
  allowSourceNamespaceOverride: true
