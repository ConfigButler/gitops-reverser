apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: home-cluster-state
  namespace: homelab-config
spec:
  providerRef:
    name: mirror-repository
  clusterProviderRef:
    name: home
  branch: main
  path: clusters/home
  suspend: true               # adoption dry run: scans and publishes, writes nothing
  # The WatchRule beside this file names source namespaces other than its own, so
  # the folder owner must say which ones may arrive here. Without it the rule is
  # refused (SourceNamespaceAuthorized=False) — the deny-by-default posture.
  # NOTE: the wave in docs/design/source-scope-simplification.md DELETES this field;
  # afterwards the ClusterProvider's allowAnySourceNamespace is the only grant needed.
  allowedSourceNamespaces:
    names: [shop, billing]
  # No placement declared and no kustomization anywhere in the subtree, so the
  # ladder falls through to the canonical identity path:
  #   {namespaceOrCluster}/{groupPath}/{resource}/{name}.yaml
  # This is the only shape in this set that needs no LAYOUT configuration at all.
  # `true` is also what lets the folder hold two source namespaces: the
  # one-source-namespace rule binds only an explicit `false`.
  serializeNamespace: true
