apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: checkout-artifact
  namespace: shop
spec:
  providerRef:
    name: artifacts-repository
  branch: main
  path: apps/checkout
  suspend: true               # adoption dry run: scans and publishes, writes nothing
  # One file per object, flat, and no {namespace} in the template: the folder is
  # single-namespace by construction.
  placement:
    default: "{name}.yaml"
  # The supplier is OUTSIDE the repository: the consuming Flux Kustomization sets
  # spec.targetNamespace. Nothing in the folder proves that, which is what the
  # post-scan guard has to be told rather than shown. See the README.
  serializeNamespace: false
