apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: shop-configuration
  namespace: shop
spec:
  providerRef:
    name: artifacts-repository
  clusterProviderRef:
    name: app-intent
  branch: main
  path: apps/shop
  placement:
    # The folder does not exist yet, so the root that supplies the namespace has to
    # be created before the namespace can be left out. useKustomize is what makes
    # the omission provable rather than trusted: the operator owns the
    # kustomization.yaml it writes namespace: shop into.
    useKustomize: true
    serializeNamespace: false
