apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: demo-workloads
  namespace: demo
spec:
  providerRef:
    name: app-repository
  branch: main
  path: apps/demo
  suspend: true          # adoption dry run: scans and publishes, writes nothing
  # Nothing else is declared, and that is the point: the folder already has a
  # kustomization.yaml, so new files are placed beside it and registered in its
  # resources: automatically. Adoption needs no configuration.
