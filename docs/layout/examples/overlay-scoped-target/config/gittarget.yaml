apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: podinfo-prod-overlay
  namespace: podinfo-prod
spec:
  providerRef:
    name: homelab-repository
  branch: main
  path: apps/podinfo/overlays/prod
  allowedSourceNamespaces:
    names: [podinfo-prod]
  mode: Observe
  serializeNamespace: Never
  kustomizeRoot: Require
