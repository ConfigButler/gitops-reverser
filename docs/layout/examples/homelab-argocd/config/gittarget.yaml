apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: argocd-applications
  namespace: argocd
spec:
  providerRef:
    name: homelab-repository
  branch: main
  path: bootstrap/argocd-applications
  allowedSourceNamespaces:
    names: [argocd]
  mode: Observe
  # Never is safe here only because the folder's kustomization.yaml supplies
  # namespace: argocd — and that file belongs to the repository owner, not to us.
  # Require is the guard: if the root is deleted, stop writing rather than commit
  # documents that land in whatever namespace the applier defaults to.
  serializeNamespace: Never
  kustomizeRoot: Require
