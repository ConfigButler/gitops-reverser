apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: argocd-applications
  namespace: argocd
spec:
  providerRef:
    name: homelab-repository
  branch: main
  path: bootstrap/argocd-applications
  allowedSourceNamespaces:
    names: [argocd]
  mode: Write
  layout:
    kind: Kustomize
    scope: SingleNamespace
    namespace: argocd
    writeNamespace: Never
    kustomize:
      root: .
