apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 30m
  # The HelmRelease object lives in flux-system with the rest of the Flux
  # declarations; the release it installs does not. targetNamespace is what puts
  # jellyfin in `media`, and storageNamespace keeps its Helm storage beside the
  # controller that manages it.
  targetNamespace: media
  storageNamespace: flux-system
  chart:
    spec:
      chart: jellyfin
      version: 2.1.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
  values:
    persistence:
      config:
        enabled: true
    service:
      type: ClusterIP
