version: 2
updates:
  - package-ecosystem: "gomod"
    # Two modules. "/" is the operator itself; "/hack/sops-build" pins the SOPS
    # version the image builds from source, plus the dependencies held ahead of
    # the ones SOPS requires. That second module exists TO be updated — it is how
    # a CVE in the SOPS binary reaches us as a pull request instead of waiting on
    # an upstream release — so leaving it off this list would defeat the point.
    directories:
      - "/"
      - "/hack/sops-build"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    # Covers the project Dockerfile, the devcontainer/CI base image and the
    # mutation-lab fixture image, so FROM lines keep moving with upstream.
    # A directory left off this list silently drifts: /test/mutationlab sat on
    # golang 1.27.0 while the other two were bumped.
    directories:
      - "/"
      - "/.devcontainer"
      - "/test/mutationlab"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"