version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    # Covers the project Dockerfile, the devcontainer/CI base image and the
    # mutation-lab fixture image, so FROM lines keep moving with upstream.
    # A directory left off this list silently drifts: /test/mutationlab sat on
    # golang 1.27.0 while the other two were bumped.
    directories:
      - "/"
      - "/.devcontainer"
      - "/test/mutationlab"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"