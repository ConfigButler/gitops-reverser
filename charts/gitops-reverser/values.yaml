# Default values for gitops-reverser.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# High Availability configuration - runs 1 replicas by default (HA support is not good enough yet)
replicaCount: 1
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

image:
  repository: ghcr.io/configbutler/gitops-reverser
  pullPolicy: IfNotPresent
  tag: 0.53.0 # x-release-please-version

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# Create the release namespace as part of chart rendering (useful for install.yaml workflows).
# Keep false for standard Helm installs where --create-namespace is preferred.
createNamespace: false

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# Extension points the Deployment appends as-is. Declared here because the template already
# reads them; without an entry they are invisible to anyone reading values.yaml.
env: [] # Kubernetes EnvVar entries, e.g. [{name: REDIS_PASSWORD, valueFrom: {...}}]
volumes: []
volumeMounts: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# Controller manager behaviour (the servers it runs are configured under `servers`).
controllerManager:
  # Extra Secret-shaped resources that must use the encrypted Git write path.
  # Entries are resource or group/resource, for example core.cozystack.io/tenantsecrets.
  additionalSensitiveResources: []
  # KubeProviders, as namespace/name, that may use spec.inCluster: the operator's own identity in
  # the cluster it runs in. The KubeProvider the chart renders (kubeProvider, below) is added on its
  # own when it uses inCluster, so list only the others. Exact names, no wildcards: anyone who can
  # create a KubeProvider with a listed name wields the operator's identity through it. A
  # KubeProvider that sets inCluster and is not listed reports InClusterNotAuthorized and is never
  # used.
  inClusterKubeProviders: []
  # Permit credentials with http:// GitProvider URLs. This is only for trusted
  # in-cluster development Git servers; production remotes should use HTTPS or SSH.
  insecureAllowGitHTTP: false
  # Event queue depth per branch worker. One branch worker is shared by every GitTarget
  # writing to one (GitProvider, branch), so pointing another GitTarget at a branch
  # divides the headroom of a worker already in use.
  #
  # A full queue REFUSES the write and counts git_queue_refusals_total, rather than stalling
  # the watch path behind a slow remote. The watch keeps its cursor and delivers the write
  # again, but its stream stalls meanwhile, and a cursor that expires first loses that
  # write's own commit (and, under prune.mode OnEvent, a delete's removal) — so raise this if git_queue_refusals_total is non-zero on a healthy
  # branch. Size it so a bounded burst cannot overrun it:
  # roughly (concurrent writers) x (GitTargets sharing the branch worker). Note that an
  # administrative burst (an unpaced `kubectl delete` of many objects) is far spikier than
  # the steady-state traffic the depth gauge shows you.
  #
  # Costs pod memory ON TOP of branchBufferMaxSize on a healthy branch, where that cap does
  # NOT cover this queue (during a Git outage it does). Budget queue depth x serialized size
  # x ~6 (a queued object is held as an unstructured map), per SATURATED worker — about
  # 5Mi at this default for ~800-byte resources, but the multiplier is on the payload, so
  # size it against your own if you mirror megabyte-sized ConfigMaps or Secrets.
  branchWorkerQueueDepth: 1000
  # Maximum in-memory event buffer per branch worker, as a Kubernetes resource quantity.
  # Bounds the open commit window plus the writes retained for replay until a push
  # succeeds; tripping it finalizes the window early, ignoring the commit cadence. While the
  # remote cannot be reached, it also bounds everything the worker accepts, queued work
  # included: work that would exceed it pauses the worker's intake of new writes, saves and
  # resyncs until a push lands, and the watch delivers what was refused once intake reopens.
  branchBufferMaxSize: 8Mi
  # How long a CommitRequest is kept once it finishes, as a duration. Every save leaves one object
  # behind, so without this they accumulate for as long as the namespace lives. The controller
  # writes the deletion time onto the request as the annotation configbutler.ai/delete-after when
  # it finishes; remove or edit that annotation to keep one request or move its deletion. Set "0"
  # to write no annotation, so new requests are kept.
  commitRequestTTL: 48h

# How the operator treats the Git remote.
git:
  # How often an IDLE GitTarget re-proves where its branch is on the Git remote, as a duration.
  # Set "0" to disable it.
  #
  # A target that is publishing pays nothing for this: its pushes already prove where the branch
  # is, so it never schedules a refresh. An idle branch pays one ref advertisement per interval,
  # and a fetch only on the intervals where the branch actually moved. What it buys is
  # status.remote staying true on a target nobody is writing to, and a folder somebody changed in
  # Git being noticed without an operator asking for it.
  #
  # The effective granularity is the 5-minute control-plane reconcile, so a value below that means
  # "every tick". gitopsreverser_git_fetches_total{reason="refresh"} is what it costs.
  refreshInterval: 10m


# Optional RBAC that lets GitOps Reverser hold the applier an applier claim names in this cluster:
# a FluxClaim's Kustomization, suspended and resumed for each apply, or an ArgoCDClaim's
# Application, synced for each apply. Off unless asked for, since one-way mirroring needs neither.
applierAccess:
  # Grant get/patch on kustomize.toolkit.fluxcd.io Kustomizations and source.toolkit.fluxcd.io
  # GitRepositories, list on Kustomizations, HelmReleases and HelmCharts (to find what else applies
  # a GitRepository), plus create on SelfSubjectAccessReviews (to check that access
  # before relying on it). Cluster-wide, because an applier claim's applier can live in any namespace.
  flux: false
  # Grant get/update/patch on argoproj.io Applications (a sync is started by updating the
  # Application's operation, as Argo CD's own automated sync does, and its automated sync is held off
  # with a server-side apply), plus create on SelfSubjectAccessReviews.
  # Cluster-wide, like the Flux grant.
  argocd: false

# cert-manager issuer shared by every certificate the chart mints. One self-signed CA
# backs them all, so the issuer is genuinely cross-cutting and lives here; each server
# opts into a cert via servers.<name>.tls.certManager. (Deliberately NOT duplicated per
# server — that one shared resource is the exception to the "servers as peers" rule.)
certManager:
  enabled: true
  issuer:
    name: selfsigned-issuer
    kind: Issuer
    create: true

# Every HTTP(S) server the manager runs, as peers. Each has a bindAddress; those fronted
# by a Service also have a port, and those serving TLS carry a tls block of the same
# shape (enabled, certManager, cert paths, secretNameOverride). cert-manager mints a
# serving cert for a server when certManager.enabled (above) and that server's
# tls.certManager are both true.
servers:
  # Disable HTTP/2 on the TLS servers (mitigates the HTTP/2 Rapid-Reset CVE class).
  enableHTTP2: false

  # Liveness/readiness probe endpoint. Plain HTTP, no TLS, no Service.
  healthProbe:
    bindAddress: ":8081"
    port: 8081

  metrics:
    bindAddress: ":8080"
    port: 8080
    tls:
      # Serve metrics over HTTPS when true, HTTP when false.
      enabled: false
      # Mint the serving cert via cert-manager (only used when tls.enabled).
      certManager: true
      certPath: "/tmp/k8s-metrics-server/metrics-server-certs"
      certName: "tls.crt"
      certKey: "tls.key"
      # Leave empty to use the chart-generated Secret name.
      secretNameOverride: ""

  # Validating admission server hosting the validate-operator-types webhook, which captures
  # the submitter of each CommitRequest at admission and records it as the request's named actor
  # (read back by the controller with no wait). Independent of `attribution` below:
  # attribution governs *mirrored-resource* authorship (from audit), this governs
  # *command* authorship (from admission). Off → CommitRequests claim no actor and report
  # AuthorAttributed=False. See
  # docs/spec/commitrequest-admission-authorship.md.
  #
  # Command-author capture is Redis-backed: the captured author is written to Redis at admission and
  # read back at reconcile. Enabled by default so the webhook is always installed, but it is a no-op
  # without Redis: the pod runs healthy and CommitRequests claim no actor
  # (AuthorAttributed=False) until queue.redis.addr is set.
  admission:
    enabled: true
    bindAddress: ":9443"
    port: 9443
    # Bounded per-request wait before the apiserver gives up on the webhook.
    # failurePolicy is Ignore, so a slow/unreachable backend admits the command anyway.
    timeoutSeconds: 2
    tls:
      # The admission server always serves TLS (the apiserver requires HTTPS); the only
      # choice is who mints the cert. certManager=false means BYO via secretNameOverride
      # (and patch the webhook caBundle out of band).
      certManager: true
      certPath: "/tmp/k8s-webhook-server/serving-certs"
      certName: "tls.crt"
      certKey: "tls.key"
      # Leave empty to use the chart-generated Secret name.
      secretNameOverride: ""

  audit:
    # host:port the audit ingress server binds to (passed as --audit-bind-address).
    bindAddress: "0.0.0.0:9444"
    # Container/Service port; must match the port in bindAddress above.
    port: 9444
    timeouts:
      read: "15s"
      write: "30s"
      idle: "60s"
    maxRequestBodyBytes: 10485760
    tls:
      # Serve audit ingress over HTTPS when true, HTTP when false.
      enabled: true
      # Mint the audit serving cert (and the kube-apiserver client cert below) via
      # cert-manager. Set false to provide those Secrets yourself.
      certManager: true
      certPath: "/tmp/k8s-audit-server/audit-server-certs"
      certName: "tls.crt"
      certKey: "tls.key"
      clientCAPath: "/tmp/k8s-audit-server/audit-client-ca"
      clientCAName: "tls.crt"
      # Leave empty to use the chart-generated Secret name.
      secretNameOverride: ""
      # Audit alone also needs a CA that signs the kube-apiserver client cert (mTLS), so
      # the root CA and that client cert are configured here, under audit.
      rootCA:
        # Leave empty to use the chart-generated Secret name.
        secretNameOverride: ""
      client:
        # Keep the kube-apiserver client cert long-lived by default so cluster admins are
        # protected from frequent manual audit-webhook kubeconfig updates and kube-apiserver
        # reconfiguration. cert-manager durations use Go-style units, so years must be
        # expressed in hours (10y = 87600h).
        duration: "87600h"
        # Renew 30 days before expiry. Shortening this increases control-plane maintenance
        # because kube-apiserver embeds this client credential in its audit webhook kubeconfig.
        renewBefore: "720h"
        # Leave empty to use the chart-generated Secret name.
        secretNameOverride: ""

  # The push receiver: the endpoint a Git host's push webhook points at, so GitOps Reverser learns in
  # seconds, instead of at the next refresh, that somebody else pushed. A GitReceiver publishes its
  # path as status.webhookPath (/git-push/<digest of the token>), and a delivery to it wakes every
  # GitProvider whose spec.url it names.
  # Off by default: a foreign push is then still found, by the next rejected push or by
  # git.refreshInterval. Enabled, the chart adds a containerPort and a <release>-receiver Service
  # (port service.ports.receiver). The listener is plain HTTP, because a Git host cannot present the
  # client certificate the audit listener requires: expose the Service to your Git host with an
  # Ingress or Gateway route of your own that terminates TLS, the way Flux's webhook-receiver is
  # exposed. Every request must still carry a valid signature for the route it names.
  receiver:
    enabled: false
    # host:port the receiver binds to (passed as --receiver-bind-address).
    bindAddress: ":9292"
    # Container/Service target port; must match the port in bindAddress above.
    port: 9292

# Redis/Valkey holds each GitTarget's watch resume cursors (warm restart) and, when attribution is
# enabled, the audit attribution facts. Empty by default: the chart runs in configured-author mode with
# no Redis (watches cold-replay on restart). Set addr to enable warm restarts; required when
# attribution.enabled is true.
queue:
  redis:
    # Redis/Valkey endpoint (host:port). Empty by default (no Redis, configured-author mode). Set to a
    # host:port for warm restarts; required when attribution.enabled is true.
    addr: ""
    auth:
      # Pre-existing Secret (same namespace) holding the Redis password. Empty by default (no Redis).
      # Set it when queue.redis.addr points at an authenticated Valkey; leave empty for a Valkey with
      # no auth.
      existingSecret: ""
      # Key within the Secret that holds the password value.
      existingSecretKey: "password"
      # Optional Redis username for ACL-based auth (Redis 6+). Not sensitive; stays as a plain value.
      username: ""
    db: 0
    # Root namespace for every key this release writes (cursors, attribution facts, command author
    # records). Give each reverser its own prefix to share one Redis/Valkey between more than the 16
    # logical databases `db` can separate. A Valkey ACL can enforce it (~<prefix>:*) rather than trust
    # it. Changing it orphans the keys written under the previous prefix: cursors then cold-replay
    # once, which is safe. Allowed characters: [A-Za-z0-9], '-', '_', '.' and ':'.
    keyPrefix: "gitops-reverser"
    tls:
      enabled: false

# Commit-author attribution from audit facts. Off by default so first-time installs can prove the
# Kubernetes-to-Git workflow without kube-apiserver audit webhook configuration. With it off, the
# operator runs configured-author (Redis optional — leave queue.redis.addr empty to run without it), and every mirrored-resource commit uses the
# configured committer.
attribution:
  # When true, run the audit webhook ingress and name commit authors from matching audit facts. It
  # needs a fact transport, which is not the same as needing Redis: `transport: redis` requires a
  # non-empty queue.redis.addr, while `transport: memory` needs none and requires replicaCount 1.
  # When false, run configured-author (no audit ingress, commits authored by the committer); Redis
  # stays optional either way (leave queue.redis.addr empty to run without it).
  enabled: false
  # Where attribution facts travel between the audit receiver and the watch side.
  # "redis" (the default) appends them to Redis streams and needs a non-empty queue.redis.addr; it
  # is the production choice and the only one that survives a restart or reaches a second replica.
  # "memory" keeps them in an in-process ring, so a single-pod install can run attribution with no
  # Valkey at all — at the cost that facts do not survive a restart, and it is REFUSED at startup
  # with replicaCount > 1, where the audit receiver and the resolver are no longer one process.
  transport: "redis"
  # How long an attribution fact is retained waiting for the matching watch event to join it. It
  # bounds stream retention and the in-memory index together, and doubles as the replay horizon a
  # restart warms the index from.
  ttl: "10m"
  # Bounded per-event wait for a matching audit fact before a watch event ships unresolved, authored
  # "unknown (attribution unresolved)". Larger values raise attribution hit-rate at the cost of
  # commit latency.
  grace: "3s"
  # Caps on the facts held in memory. Per-type is the primary because it is the fair one: a burst on
  # one noisy type — a deletecollection over ten thousand objects, a large rollout — must not evict
  # every other type's facts. The total bounds the pod with a number that does not scale with how
  # many types happen to be watched; overflow evicts from the type holding the most. Evictions are
  # counted on attribution_fact_index_evictions_total{reason}.
  maxFactsPerType: 4096
  maxFacts: 65536
  # How long after a deletecollection a removal in its scope may still be credited to it. It only has
  # to cover audit batching plus clock skew — the removal is attributed at delete-REQUEST time, so
  # finalizers do not stretch it. Longer widens the risk of crediting an unrelated delete to the
  # collection's actor.
  collectionWindow: "30s"
  # How many object uids a deletecollection fact carries before the set is dropped and the join falls
  # back to scope matching. The fallback is already correct, so this only decides how often the
  # precise path is taken; drops are counted on attribution_collection_without_uidset_total{reason}.
  collectionUIDCap: 10000
  # Audit-event annotation naming the AUDIT ROUTE each event belongs to. Audit routes are normally
  # NAMED (/audit-webhook/<audit-route>, such as /audit-webhook/gitops-reverser.local), and this is
  # empty.
  # Set it only for a control plane that emits ONE shared audit stream for several logical
  # clusters: it enables the bare /audit-webhook endpoint, which reads this annotation from every
  # event, so one batch may fan out to several routes. A KubeProvider joins a route by setting
  # spec.attribution.auditRoute to the same value; it defaults to <namespace>.<name>. An event
  # with no annotation is rejected (counted and logged) and never credited to a fallback.
  # See docs/configuration.md.
  auditRouteAnnotationKey: ""

# The source cluster a GitTarget mirrors FROM is a KubeProvider, which every GitTarget names
# explicitly (spec.kubeProviderRef, with a namespace when it is not the GitTarget's own). The
# operator NEVER creates one, so it has to come from somewhere: either you commit it yourself, or
# the chart renders one from here, in the release namespace. Nothing falls back to it.
kubeProvider:
  # Render and OWN a KubeProvider named kubeProvider.name in the release namespace. Chart-owned:
  # turn this off and Helm deletes the provider it created on the next upgrade, so ownership never
  # silently splits — plan that switch together with committing your own object, because a
  # GitTarget whose provider is missing is held unready (KubeProviderNotFound).
  create: true
  # The provider's name. Its audit route is <release namespace>.<name>, which is the
  # /audit-webhook/<route> path the API server's audit webhook posts to.
  name: local
  # Which cluster the provider names. Leave name empty for the operator's OWN identity in the
  # cluster it runs in (spec.inCluster; the chart lists the provider in
  # --in-cluster-kube-providers). Set it to a Secret in the release namespace holding a kubeconfig
  # to mirror a REMOTE cluster instead. Immutable once created: to repoint, delete and recreate.
  # key is optional — empty reads "value" then "value.yaml".
  secretRef:
    name: ""
    key: ""
  # Who may use the operator's identity, and for what: rendered as the provider's
  # spec.allowedGitTargets and spec.allowedApplierClaims. Empty by default, so NOTHING mirrors or
  # holds an applier through this provider until you grant it, the release namespace included; a
  # refusal names spec.allowedGitTargets. The installer decides, never the chart.
  # quickstart.enabled=true adds a grant for exactly the quickstart namespace, and
  # values-playground.yaml grants every namespace its own namespace.
  #
  # Each grant has a `from` (Same, Names with names, Selector with a non-empty selector, or All)
  # and a scope:
  #   allowedGitTargets[].sourceNamespaces  which namespaces the WatchRules feeding an admitted
  #                                         GitTarget may watch: names, "{consumer.namespace}" or
  #                                         "{consumer.name}" for the GitTarget's namespace or
  #                                         name, or "*"
  #   allowedGitTargets[].clusterResources  which cluster-scoped types a ClusterWatchRule may mirror:
  #                                         resource.group, a bare core resource, or "*"
  #   allowedApplierClaims[].applierNamespaces  where an admitted applier claim's Kustomization or
  #                                         Application may live
  # With an inCluster provider a grant bypasses live namespace RBAC through the operator's own
  # identity: the owner of an admitted object acts on the namespaces in its scope.
  #
  #   allowedGitTargets:
  #     - from: Selector
  #       selector: {matchLabels: {platform.example.com/tenant: "true"}}
  #       sourceNamespaces: ["{consumer.namespace}"]
  #   allowedApplierClaims:
  #     - from: Names
  #       names: [team-a]
  #       applierNamespaces: [flux-system]
  allowedGitTargets: []
  allowedApplierClaims: []

# RBAC configuration
rbac:
  create: true
  # Which types the reverser may read. It never writes to a watched type, so verbs are always
  # get/list/watch (applierAccess, above, is a separate grant). Shape is enforced by values.schema.json; see docs/rbac.md.
  #
  #   any      cluster-wide read on everything, so a WatchRule can name any type — including
  #            one installed later. It also means the reverser can list and read every Secret
  #            in the cluster, credentials that have nothing to do with it included.
  #   selected read only the types below, so the reverser cannot list or watch Secrets at all.
  #            (The manager role keeps `get` on Secrets: it still reads the git-creds and
  #            age-key Secrets a GitProvider/GitTarget names.) A WatchRule naming a type you
  #            did not grant will fail to watch it. namespaces, CRDs and apiservices come from
  #            the manager role — do not restate them.
  watchTypes:
    mode: any # any | selected
    selected: []
    # - apiGroups: [""] # core group
    #   resources: ["configmaps"]
    # - apiGroups: ["apps"]
    #   resources: ["deployments"]

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 10m
    memory: 256Mi

# Node selection
nodeSelector: {}

# Tolerations
tolerations: []

# Pod affinity/anti-affinity (default anti-affinity for HA)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gitops-reverser
          topologyKey: kubernetes.io/hostname

# Pod disruption budget (enabled by default for HA)
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Monitoring and observability
monitoring:
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    # Port name on the metrics Service (see templates/services.yaml)
    port: metrics
    # Must match the effective metrics transport:
    # - https when servers.metrics.tls.enabled=true
    # - http when servers.metrics.tls.enabled=false
    scheme: http

# Service exposure
service:
  # Optional fixed ClusterIP (useful for Kind/bootstrap environments before DNS is ready)
  clusterIP: ""
  ports:
    audit: 9444
    metrics: 8080
    # Port of the <release>-receiver Service, rendered only when servers.receiver.enabled. Port 80,
    # like Flux's webhook-receiver Service, since an Ingress or Gateway route sits in front of it.
    receiver: 80

auditService:
  type: NodePort
  nodePort: 30444
  # Optional fixed ClusterIP for the dedicated audit Service. Useful for
  # "Option 1" bootstrap models where kube-apiserver talks directly to a pinned
  # Service IP and the control-plane host can route to the service CIDR.
  clusterIP: ""

# Guidance-only values used by Helm NOTES.txt for kube-apiserver follow-up.
auditKubeconfig:
  # When true, the generated example kubeconfig in Helm notes uses
  # insecure-skip-tls-verify: true instead of a CA bundle. This is useful for
  # local/bootstrap scenarios only and is not recommended for production.
  insecureSkipTLSVerify: false

# Optional starter resources for first-commit validation.
# Disabled by default so the chart does not create example Git objects unless
# you explicitly opt in.
quickstart:
  enabled: false
  # Namespace for the starter GitProvider, GitBranch, GitTarget, and WatchRule. Create it (and the git-creds
  # Secret) before installing, so the starter GitProvider is Ready on the first reconcile instead of
  # waiting up to ~5 minutes (RequeueSteadyInterval) for the Secret to appear.
  namespace: gitops-reverser-quickstart-demo
  # Let the chart create quickstart.namespace (Helm then owns it). Left false by default because the
  # recommended flow pre-creates the namespace and git-creds Secret before install; set true only if
  # the credentials Secret will be supplied some other way.
  createNamespace: false
  gitProvider:
    name: example-provider
    # Required when quickstart.enabled=true.
    url: ""
    # The branch patterns the quickstart namespace may claim through this provider ("*" is every
    # branch); rendered as a from: Same grant in spec.allowedGitBranches.
    allowedGitBranches:
      - "*"
    secretRef:
      # Required when quickstart.enabled=true.
      name: git-creds
  # The repository branch the starter GitTarget writes. It holds the branch once the GitProvider's
  # credential can open a push session on it.
  gitBranch:
    name: example-branch
    branch: main
  gitTarget:
    name: example-target
    commit:
      # When this target's commit windows close: after idleTimeout of silence, or
      # maxDuration after the window opened, whichever comes first. It is a GitTarget
      # field: batching describes the folder being written, not the connection to the
      # repository.
      window:
        idleTimeout: "5s"
        maxDuration: "1m"
    # Required relative repository path for the starter GitTarget. The chart
    # default avoids repo-root writes; set "." only to deliberately target root.
    path: live-cluster
    encryption:
      provider: sops
      age:
        enabled: true
        generateWhenMissing: true
      secretRef:
        name: sops-age-key
  watchRule:
    name: example-watchrule
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        resources:
          - configmaps

# Logging configuration
logging:
  level: info
  development: false
  encoder: json
  # Additional logging configuration
  stacktraceLevel: error

labels:
  managedBy: Helm # Allows CI generated install.yaml creation (don't change when you are using Helm)
