apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitops-reverser.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitops-reverser.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
    prometheus.io/scrape: "true"
    prometheus.io/scheme: {{ ternary "https" "http" .Values.servers.metrics.tls.enabled | quote }}
    prometheus.io/port: "{{ .Values.service.ports.metrics }}"
spec:
  type: ClusterIP
  {{- if .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  ports:
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: {{ .Values.servers.metrics.port }}
      protocol: TCP
    {{- if .Values.servers.admission.enabled }}
    - name: webhook
      port: {{ .Values.servers.admission.port }}
      targetPort: {{ .Values.servers.admission.port }}
      protocol: TCP
    {{- end }}
  selector:
    {{- include "gitops-reverser.selectorLabels" . | nindent 4 }}
    control-plane: gitops-reverser
{{- if .Values.attribution.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitops-reverser.auditServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitops-reverser.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit
spec:
  type: {{ .Values.auditService.type }}
  {{- if .Values.auditService.clusterIP }}
  clusterIP: {{ .Values.auditService.clusterIP }}
  {{- end }}
  ports:
    - name: audit
      port: {{ .Values.service.ports.audit }}
      targetPort: {{ .Values.servers.audit.port }}
      protocol: TCP
      {{- if and (eq .Values.auditService.type "NodePort") .Values.auditService.nodePort }}
      nodePort: {{ .Values.auditService.nodePort }}
      {{- end }}
  selector:
    {{- include "gitops-reverser.selectorLabels" . | nindent 4 }}
    control-plane: gitops-reverser
{{- end }}
{{- if .Values.servers.receiver.enabled }}
---
# The push receiver: plain HTTP for Git hosts' push webhooks. ClusterIP only; expose it with an
# Ingress or Gateway route of your own that terminates TLS, the way Flux's webhook-receiver is.
# Only the elected replica serves it (a delivery drives a branch worker).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitops-reverser.receiverServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitops-reverser.labels" . | nindent 4 }}
    app.kubernetes.io/component: receiver
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.ports.receiver }}
      targetPort: receiver
      protocol: TCP
  selector:
    {{- include "gitops-reverser.selectorLabels" . | nindent 4 }}
    control-plane: gitops-reverser
{{- end }}
