{{- if .Values.kubeProvider.create }}
---
# The KubeProvider the chart renders and OWNS, in the release namespace: kubeProvider.create=false
# makes Helm delete it again. Every GitTarget names its KubeProvider explicitly
# (spec.kubeProviderRef); nothing falls back to this one. With kubeProvider.secretRef.name empty it
# uses the operator's own identity (spec.inCluster), and the chart lists it in
# --in-cluster-kube-providers, which is the only way an inCluster provider is honored. Nothing may
# use it without a grant: by default it admits no namespace. kubeProvider.allowedGitTargets and
# kubeProvider.allowedApplierClaims grant it; quickstart.enabled adds a grant for exactly the
# quickstart namespace, and values-playground.yaml grants every namespace its own.
apiVersion: configbutler.ai/v1alpha3
kind: KubeProvider
metadata:
  name: {{ .Values.kubeProvider.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitops-reverser.labels" . | nindent 4 }}
spec:
  {{- with .Values.kubeProvider.secretRef }}
  {{- if .name }}
  secretRef:
    name: {{ .name }}
    {{- with .key }}
    key: {{ . }}
    {{- end }}
  {{- else }}
  inCluster: {}
  {{- end }}
  {{- end }}
  {{- $gitTargets := .Values.kubeProvider.allowedGitTargets }}
  {{- $applierClaims := .Values.kubeProvider.allowedApplierClaims }}
  {{- if .Values.quickstart.enabled }}
  {{- $names := list .Values.quickstart.namespace }}
  {{- $gitTargets = append $gitTargets (dict "from" "Names" "names" $names "sourceNamespaces" (list "{namespace}")) }}
  {{- $applierClaims = append $applierClaims (dict "from" "Names" "names" $names "applierNamespaces" (list "{namespace}")) }}
  {{- end }}
  {{- with $gitTargets }}
  allowedGitTargets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $applierClaims }}
  allowedApplierClaims:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
