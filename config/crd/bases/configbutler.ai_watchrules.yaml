---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: watchrules.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: WatchRule
    listKind: WatchRuleList
    plural: watchrules
    singular: watchrule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gitTargetRef.name
      name: GitTarget
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.streams.summary
      name: Streams
      type: string
    - jsonPath: .status.conditions[?(@.type=="StreamsRunning")].status
      name: StreamsRunning
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="SourceNamespaceAuthorized")].status
      name: SourceAuthorized
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="ResourcesResolved")].status
      name: ResourcesResolved
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          WatchRule selects namespaced resources for a GitTarget in its namespace to mirror, by type,
          API group, version, source namespace and label. Each rule reads one source namespace: this
          WatchRule's own by default. Use a ClusterWatchRule for cluster-scoped types.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WatchRule.
            properties:
              gitTargetRef:
                description: |-
                  GitTargetRef names the GitTarget, in this namespace, that mirrors what this WatchRule
                  selects.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.gitTargetRef.name must not be empty
                  rule: self.name != ''
              rules:
                description: |-
                  Rules select the resources to mirror. A resource matching any rule is mirrored. Each rule
                  names resource types, optionally narrowed by API group, version, source namespace and
                  labels. The GitTarget's spec.prune.mode decides whether a removal on the cluster deletes the
                  Git document.
                items:
                  description: |-
                    ResourceRule selects namespaced resources by type, and optionally by API group, version, source
                    namespace and label.
                  properties:
                    apiGroups:
                      description: |-
                        APIGroups are the API groups to match: "" is the core group, and "*" is every group, as in
                        ["", "apps"] or ["*"]. Omitted, each resource name is looked up across the served groups and
                        must be served by exactly one.
                      items:
                        type: string
                      type: array
                    apiVersions:
                      description: |-
                        APIVersions are the versions to match, or "*" for every served version. Omitted, each
                        resource's preferred version is used. The built-in Git path has no version, so two versions
                        of one object share a file unless the GitTarget's placement template includes {version}.
                      items:
                        type: string
                      type: array
                    objectSelector:
                      description: |-
                        ObjectSelector mirrors only the objects whose labels match, as a standard label selector.
                        Omitted or {} selects every object. An object that stops matching leaves the mirror as a
                        deleted one does, and spec.prune.mode decides what happens to its document. Under prune mode
                        "Always", a resync also removes documents of the type that the selector never matched. Two
                        rules on one GitTarget that select the same type in overlapping namespaces must use the same
                        selector; the newer rule is refused. A selector that does not parse refuses the whole rule
                        (ResourcesResolved=False, reason InvalidObjectSelector).
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    resources:
                      description: |-
                        Resources are the resource types to match, by plural name ("configmaps", "deployments"), or
                        "*" for every type. Matching is exact and case-insensitive; partial wildcards such as "pod*"
                        match nothing, and subresources ("pods/log") are rejected. For a custom resource whose name
                        more than one group serves, set apiGroups.
                      items:
                        minLength: 1
                        pattern: ^[^/]*$
                        type: string
                      minItems: 1
                      type: array
                    sourceNamespace:
                      description: |-
                        SourceNamespace is the source-cluster namespace this rule reads: omitted for this
                        WatchRule's own namespace, a name for another one, or "*" for every namespace the
                        KubeProvider's credential can read. Git placement follows each object's own namespace, not
                        this field.

                        The KubeProvider's spec.allowedGitTargets must allow the namespace, through the
                        sourceNamespaces of a grant admitting the GitTarget; "*" needs "*" there. One rule outside
                        the grants refuses the whole WatchRule (SourceNamespaceNotAllowed), checked when it
                        reconciles.
                      maxLength: 63
                      pattern: ^(\*|[a-z0-9]([-a-z0-9]*[a-z0-9])?)$
                      type: string
                  required:
                  - resources
                  type: object
                minItems: 1
                type: array
            required:
            - gitTargetRef
            - rules
            type: object
          status:
            description: status defines the observed state of WatchRule.
            properties:
              conditions:
                description: |-
                  Conditions are the latest observations of this WatchRule's state. Ready, Reconciling and
                  Stalled follow kstatus; ResourcesResolved, SourceNamespaceAuthorized and StreamsRunning say
                  which check holds the rule back.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              streams:
                description: Streams counts the types this WatchRule resolves, by
                  watch state.
                properties:
                  blocked:
                    description: Blocked is how many of them cannot be watched right
                      now.
                    format: int32
                    type: integer
                  pendingSample:
                    description: PendingSample names up to five types that are not
                      ready yet.
                    items:
                      type: string
                    maxItems: 5
                    type: array
                  ready:
                    description: Ready is how many of them are streaming events.
                    format: int32
                    type: integer
                  replaying:
                    description: Replaying is how many of them are still receiving
                      their initial list.
                    format: int32
                    type: integer
                  summary:
                    description: |-
                      Summary is ready/total for display, such as "3/4". Read ready and total instead of parsing
                      it.
                    type: string
                  total:
                    description: Total is how many types are watched.
                    format: int32
                    type: integer
                required:
                - blocked
                - ready
                - replaying
                - total
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
