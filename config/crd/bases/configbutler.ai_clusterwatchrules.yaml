---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: clusterwatchrules.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: ClusterWatchRule
    listKind: ClusterWatchRuleList
    plural: clusterwatchrules
    singular: clusterwatchrule
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gitTargetRef.name
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.streams.summary
      name: Streams
      type: string
    - jsonPath: .status.conditions[?(@.type=="GitTargetReady")].status
      name: GitTargetReady
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="StreamsRunning")].status
      name: StreamsRunning
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          ClusterWatchRule selects CLUSTER-SCOPED resources on the source cluster its GitTarget mirrors
          from — Nodes, PersistentVolumes, StorageClasses, ClusterRoles, CRDs, and the like. Scope is
          carried by the rule KIND, so it has no per-rule scope choice and no source-namespace selection.

          It is cluster-scoped and requires cluster-admin permissions. Its gitTargetRef names a GitTarget
          (namespace required), whose namespace must be admitted by that target's ClusterProvider. To
          mirror NAMESPACED resources use a WatchRule in the tenant namespace and set
          spec.rules[].sourceNamespace, whose "*" reaches every namespace the source credential can read.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ClusterWatchRule.
            properties:
              gitTargetRef:
                description: |-
                  GitTargetRef names the GitTarget this rule feeds. A ClusterWatchRule has no namespace of its
                  own, so the namespace is required here rather than defaulted.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent, when not specified it
                      acts as LocalObjectReference.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.gitTargetRef.name must not be empty
                  rule: self.name != ''
                - message: 'spec.gitTargetRef.namespace is required: a ClusterWatchRule
                    has no namespace to default to'
                  rule: has(self.namespace) && self.namespace != ''
              rules:
                description: |-
                  Rules define which CLUSTER-SCOPED resources to watch.
                  Multiple rules create a logical OR - a resource matching ANY rule is watched.
                  A rule that resolves to no cluster-scoped type simply watches nothing; use a WatchRule with
                  spec.rules[].sourceNamespace for namespaced resources.
                items:
                  description: |-
                    ClusterResourceRule defines which CLUSTER-SCOPED resources to watch. It deliberately has no
                    sourceNamespace: cluster-scoped objects have no namespace, so there is nothing to select.
                  properties:
                    apiGroups:
                      description: |-
                        APIGroups to match. Empty string ("") matches the core API group.
                        If omitted, GitOps Reverser resolves the resource name across all served API groups.
                        Wildcards supported: "*" matches all groups.
                        Examples:
                          - [""] matches core API (nodes, namespaces)
                          - ["rbac.authorization.k8s.io"] matches RBAC resources
                          - ["*"] matches all groups
                          - [] resolves a named resource only when it is served by one API group
                      items:
                        type: string
                      type: array
                    apiVersions:
                      description: |-
                        APIVersions to match. If empty, uses the preferred served version for each group/resource.
                        Wildcards supported: "*" matches all versions.
                        Examples:
                          - ["v1"] matches only v1 version
                          - ["*"] matches all served versions
                          - [] matches the preferred served version
                      items:
                        type: string
                      type: array
                    operations:
                      description: |-
                        Operations to watch. If empty, watches all operations (CREATE, UPDATE, DELETE).
                        Supports: CREATE, UPDATE, DELETE, or * (wildcard for all operations).
                        Examples:
                          - ["CREATE", "UPDATE"] watches only creation and updates
                          - ["*"] or [] watches all operations
                      items:
                        description: OperationType specifies the type of operation
                          that triggers a watch event.
                        enum:
                        - CREATE
                        - UPDATE
                        - DELETE
                        - '*'
                        type: string
                      type: array
                    resources:
                      description: |-
                        Resources to match (plural names like "nodes", "clusterroles").
                        This field is required and determines which resource types trigger this rule.
                        Wildcard semantics follow Kubernetes admission webhook patterns:
                          - "*" matches all resources
                          - "nodes" matches exactly nodes
                          - "pods" matches exactly pods (for namespaced scope)

                        Note: Subresources cannot be added here. Values containing "/" (for example
                        "pods/log" or "pods/*") are rejected by the API because subresources are
                        not supported for list/watch snapshot planning. Prefix/suffix wildcards
                        like "pod*" or "*.example.com" are NOT supported. Use exact matches or the
                        "*" wildcard for broad matching.
                      items:
                        minLength: 1
                        pattern: ^[^/]*$
                        type: string
                      minItems: 1
                      type: array
                  required:
                  - resources
                  type: object
                minItems: 1
                type: array
            required:
            - gitTargetRef
            - rules
            type: object
          status:
            description: status defines the observed state of ClusterWatchRule.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the ClusterWatchRule's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              streams:
                description: Streams is the bounded stream-readiness roll-up for the
                  types this rule resolves.
                properties:
                  blocked:
                    description: Blocked is how many resolved types cannot currently
                      be watched.
                    format: int32
                    type: integer
                  pendingSample:
                    description: PendingSample is a bounded sample of types not yet
                      ready.
                    items:
                      type: string
                    maxItems: 5
                    type: array
                  ready:
                    description: Ready is how many resolved types are Streaming.
                    format: int32
                    type: integer
                  replaying:
                    description: Replaying is how many resolved types are still replaying
                      their initial events.
                    format: int32
                    type: integer
                  summary:
                    description: Summary is the display-only ready/total ratio.
                    type: string
                  total:
                    description: Total is how many types this rule resolves.
                    format: int32
                    type: integer
                required:
                - blocked
                - ready
                - replaying
                - total
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
