---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: commitrequests.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: CommitRequest
    listKind: CommitRequestList
    plural: commitrequests
    singular: commitrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gitTargetRef.name
      name: GitTarget
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.commit
      name: Commit
      type: string
    - jsonPath: .status.conditions[?(@.type=="AuthorAttributed")].status
      name: AuthorAttributed
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Pushed")].status
      name: Pushed
      priority: 1
      type: string
    - jsonPath: .status.branch
      name: Branch
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          CommitRequest is a one-shot "save" signal. It attaches to its author's current or next
          commit window on the referenced GitTarget, closes that window on its own timers instead of the
          target's, and gives the resulting commit its message. The commit hash is reported in status
          once the commit is on the remote.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CommitRequest
            properties:
              gitTargetRef:
                description: |-
                  GitTargetRef names the GitTarget whose commit window this request attaches to.
                  The GitTarget must be in the same namespace as this CommitRequest.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.gitTargetRef.name must not be empty
                  rule: self.name != ''
              message:
                description: |-
                  Message is an optional commit message for the finalized commit. When
                  omitted, the target's liveTemplate is used. Template-like text remains literal.

                  When present it is limited to 1-1024 Unicode characters and used
                  verbatim as the commit message. Newlines are allowed so a subject and
                  body can be supplied; all other ASCII control characters (including tab
                  and carriage return) are rejected. Whitespace-only messages are rejected.
                maxLength: 1024
                minLength: 1
                pattern: ^[^\x00-\x09\x0B-\x1F\x7F]*$
                type: string
                x-kubernetes-validations:
                - message: message must contain a non-whitespace character
                  rule: self.matches(r'[^\s\x{0085}\x{00A0}\x{1680}\x{2000}-\x{200A}\x{2028}\x{2029}\x{202F}\x{205F}\x{3000}]')
              whenNothingToCommit:
                default: Resolve
                description: |-
                  WhenNothingToCommit decides what the request does when it ends with nothing to commit:
                  because attachTimeout ran out with no eligible window, or because the window it attached to
                  closed, for any reason, without changing Git. Resolve finishes without a commit; CommitEmpty
                  records spec.message in an empty commit, and the Ready reason still says which of the two
                  happened. A window that belonged to another author never falls back to an empty commit. A
                  request on a GitTarget that may not be written (suspended, or render fidelity not established)
                  fails with that reason under either value. Defaults to Resolve.
                enum:
                - Resolve
                - CommitEmpty
                type: string
              window:
                default:
                  attach: CurrentOrNext
                  attachTimeout: 2s
                  maxDuration: 2s
                description: |-
                  Window says which commit window this request attaches to, how long it waits for one, and
                  the timers that close the window once it has attached. They replace the GitTarget's timers
                  for that window, shorter or longer. Omitted, it is the defaults of every field below: attach
                  to the author's current or next window within 2s, then close it 2s later.
                properties:
                  attach:
                    default: CurrentOrNext
                    description: |-
                      Attach selects the window: CurrentOrNext attaches to the author's window if one is open
                      when the worker registers the request, and otherwise to the next one; Next first closes the
                      author's open window, under its own message, and attaches to the next one. Defaults to
                      CurrentOrNext.
                    enum:
                    - CurrentOrNext
                    - Next
                    type: string
                  attachTimeout:
                    default: 2s
                    description: |-
                      AttachTimeout is how long the request waits for a window to attach to, counted from when
                      the branch worker registers it, as a Go duration string. "0s" attaches to a window already
                      open, or gives up at once. A request whose wait ran out never takes a later window. At most
                      "5m". Defaults to "2s", which covers a write's wait for its audit fact.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|μs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: spec.window.attachTimeout must not exceed 5m
                      rule: duration(self) <= duration('5m')
                  idleTimeout:
                    description: |-
                      IdleTimeout closes the attached window after this much silence; every write it collects
                      restarts it. Omitted, the window has no idle close and maxDuration alone ends it. At most
                      "5m".
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|μs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: spec.window.idleTimeout must not exceed 5m
                      rule: duration(self) <= duration('5m')
                  maxDuration:
                    default: 2s
                    description: |-
                      MaxDuration closes the attached window this long after the request attached, however much
                      keeps arriving. "0s" finalizes right after the attach. At most "5m". Defaults to "2s".
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|μs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: spec.window.maxDuration must not exceed 5m
                      rule: duration(self) <= duration('5m')
                type: object
                x-kubernetes-validations:
                - message: CommitRequest spec is immutable after creation
                  rule: self.attach == oldSelf.attach && duration(self.attachTimeout)
                    == duration(oldSelf.attachTimeout) && duration(self.maxDuration)
                    == duration(oldSelf.maxDuration) && has(self.idleTimeout) == has(oldSelf.idleTimeout)
                    && (!has(self.idleTimeout) || duration(self.idleTimeout) == duration(oldSelf.idleTimeout))
                - message: spec.window.idleTimeout must not exceed maxDuration
                  rule: '!has(self.idleTimeout) || duration(self.idleTimeout) <= duration(self.maxDuration)'
                - message: 'attach: Next needs a positive attachTimeout; with 0s it
                    would close the author''s window and give up in the same instant'
                  rule: self.attach != 'Next' || duration(self.attachTimeout) > duration('0s')
            required:
            - gitTargetRef
            type: object
            x-kubernetes-validations:
            - message: CommitRequest spec is immutable after creation
              rule: self.gitTargetRef == oldSelf.gitTargetRef && has(self.message)
                == has(oldSelf.message) && (!has(self.message) || self.message ==
                oldSelf.message) && has(self.window) == has(oldSelf.window) && has(self.whenNothingToCommit)
                == has(oldSelf.whenNothingToCommit) && (!has(self.whenNothingToCommit)
                || self.whenNothingToCommit == oldSelf.whenNothingToCommit)
            - message: 'whenNothingToCommit: CommitEmpty requires spec.message, because
                a message is all an empty commit records'
              rule: '!has(self.whenNothingToCommit) || self.whenNothingToCommit !=
                ''CommitEmpty'' || has(self.message)'
          status:
            description: status defines the observed state of CommitRequest
            properties:
              branch:
                description: |-
                  Branch is the Git branch the GitTarget commits to. Populated once the
                  finalize resolves.
                type: string
              commit:
                description: Commit is the resulting commit hash. Set when the commit
                  was pushed (Pushed=True).
                type: string
              conditions:
                description: |-
                  Conditions report the request's progress and terminal outcome: the Ready
                  summary, the kstatus Reconciling/Stalled pair, and the domain conditions
                  AuthorAttributed and Pushed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
