---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gitproviders.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: GitProvider
    listKind: GitProviderList
    plural: gitproviders
    singular: gitprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.lastVerifiedAt
      name: Verified
      priority: 1
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: GitProvider is the Schema for the gitproviders API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GitProvider
            properties:
              accessFrom:
                description: |-
                  AccessFrom is the policy for which OTHER namespaces may reference this GitProvider from a
                  GitTarget. This GitProvider's own namespace is always admitted. Empty (or omitted) admits no
                  other namespace. A GitTarget admitted from another namespace writes with this provider's
                  credential, commit identity and allowedBranches, as one in its own namespace does.
                properties:
                  names:
                    description: |-
                      Names is an explicit allow-list of namespace names. Entries are namespace names (DNS-1123
                      labels), never patterns — `*` is rejected. To admit every namespace, declare `selector: {}`.
                    items:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  selector:
                    description: |-
                      Selector is a label selector matched against Namespace labels; a namespace whose labels
                      match is admitted. ORed with Names.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              allowedBranches:
                description: AllowedBranches restricts which branches can be written
                  to.
                items:
                  minLength: 1
                  type: string
                minItems: 1
                type: array
              commit:
                description: |-
                  Commit configures the commit identity and signing behavior this connection uses. Message
                  formatting moved to GitTarget.spec.commit.message.
                properties:
                  committer:
                    description: |-
                      Committer configures the operator identity written as the commit committer.
                      When signing is enabled, Email must be a verified address on the account
                      that owns the signing key.
                    properties:
                      email:
                        default: noreply@configbutler.ai
                        description: Email is the git committer email.
                        type: string
                      name:
                        default: GitOps Reverser
                        description: Name is the git committer name.
                        type: string
                    type: object
                  signing:
                    description: Signing configures commit signing.
                    properties:
                      generateWhenMissing:
                        default: false
                        description: |-
                          GenerateWhenMissing causes the operator to generate signing key material
                          in the referenced Secret when it is missing.
                        type: boolean
                      secretRef:
                        description: |-
                          SecretRef references the Secret containing the signing key material.
                          Expected keys will be defined by the signing implementation.
                        properties:
                          name:
                            description: Name of the referent.
                            type: string
                        required:
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: commit.signing.secretRef.name must not be empty
                          rule: self.name != ''
                    required:
                    - secretRef
                    type: object
                type: object
              knownHostsRef:
                description: |-
                  KnownHostsRef optionally points at a namespace-local ConfigMap or Secret holding SSH
                  known_hosts, so host trust can be centralized across GitProviders on the same host instead
                  of repeated in every credentials Secret. It is used only for SSH and ignored for HTTP auth.
                  Host keys are resolved in priority order: the credentials Secret's own known_hosts, then this
                  ref, then the install-level default known-hosts ConfigMap; if none yields valid keys, SSH
                  fails closed.
                properties:
                  kind:
                    default: ConfigMap
                    description: 'Kind of the referent: ConfigMap (default) or Secret.'
                    enum:
                    - ConfigMap
                    - Secret
                    type: string
                  name:
                    description: Name of the ConfigMap or Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              receiver:
                description: |-
                  Receiver lets the Git host tell GitOps Reverser that somebody pushed. Point the host's push
                  webhook at the receiver listener plus status.webhookPath, with the Secret's token as the
                  webhook secret. A delivery is only a hint: it makes GitOps Reverser read where the branch is
                  on the remote, and what the remote says decides whether a GitTarget's applier is asked to
                  apply. Without a receiver, a foreign push is still found, by the next rejected push or by
                  the periodic refresh.
                properties:
                  secretRef:
                    description: |-
                      SecretRef names a Secret in this namespace whose "token" key is the webhook secret. The
                      token also derives status.webhookPath, so rotating it moves the path: register the new path
                      with the new secret.
                    properties:
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - name
                    type: object
                  type:
                    description: |-
                      Type is the payload and signature the Git host sends. "github" checks X-Hub-Signature-256,
                      "gitlab" checks X-Gitlab-Token, "gitea" checks X-Gitea-Signature, and "generic-hmac" checks
                      X-Signature: sha256=<hex HMAC of the body> over a {"repository", "branch", "after"} body,
                      for a relay of your own.
                    enum:
                    - github
                    - gitlab
                    - gitea
                    - generic-hmac
                    type: string
                required:
                - secretRef
                - type
                type: object
              secretRef:
                description: |-
                  SecretRef for authentication credentials (may be nil for public repos)

                  An OMITTED secretRef means anonymous access. An empty name is refused rather than treated as
                  one: a typo there would otherwise downgrade a private repository to anonymous silently, and
                  the failure would surface as an authentication error against the remote rather than as a
                  mistake in this object.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.secretRef.name must not be empty; omit secretRef entirely
                    for anonymous access
                  rule: self.name != ''
              url:
                description: |-
                  URL of the repository (HTTP/SSH).
                  Immutable: delete and recreate the GitProvider to point at a different repository.
                minLength: 1
                type: string
            required:
            - allowedBranches
            - url
            type: object
            x-kubernetes-validations:
            - message: spec.url is immutable; delete and recreate the GitProvider
                to point at a different repository
              rule: self.url == oldSelf.url
          status:
            description: status defines the observed state of GitProvider
            properties:
              conditions:
                description: |-
                  Conditions report repository validation and commit configuration readiness:
                  the Ready summary plus the kstatus Reconciling/Stalled pair.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastVerifiedAt:
                description: |-
                  LastVerifiedAt is when the credential and the repository were last proved together: the
                  connectivity check listed the remote's refs with this provider's credential and the remote
                  answered. It is never cleared — a failure is already carried by Ready=False with a reason —
                  so the pair "not ready, last verified 11 minutes ago" says how long the connection has been
                  broken, which is the sentence an operator otherwise has to infer.

                  The check runs on the steady reconcile interval, so a provider's resourceVersion moves at
                  that cadence. Providers are few and the check was already running; this adds no request.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              signingPublicKey:
                description: |-
                  SigningPublicKey is the operator's SSH signing public key in authorized_keys format.
                  Register this as a signing key on your git platform.
                  Only populated when commit.signing is configured and a signing key is available.
                type: string
              webhookPath:
                description: |-
                  WebhookPath is the path spec.receiver is served on, under the receiver listener:
                  /git-push/ and a hash of this provider's name and the receiver token. Empty without
                  spec.receiver, and while the token Secret or its "token" key is missing.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
