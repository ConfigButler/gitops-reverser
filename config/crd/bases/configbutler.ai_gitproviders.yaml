---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: gitproviders.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: GitProvider
    listKind: GitProviderList
    plural: gitproviders
    singular: gitprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.lastVerifiedAt
      name: Verified
      priority: 1
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          GitProvider is a connection to one Git repository: its URL, the credential
          that reaches it, the committer identity and commit signing. GitBranches
          claim branches of the repository through it, as its spec.allowedGitBranches
          allow.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GitProvider.
            properties:
              allowedGitBranches:
                description: |-
                  AllowedGitBranches says which GitBranches may claim a branch of this
                  repository through this GitProvider: a grant must admit the GitBranch's
                  namespace, and one of its branchPatterns must match the GitBranch's
                  spec.branch. Grants combine by union. Unlike the grant lists of GitBranch
                  and KubeProvider it has no default: omitted or empty, no GitBranch may claim
                  through it, including in this namespace.
                items:
                  description: |-
                    GitProviderGitBranchGrant admits the GitBranches of some namespaces to
                    claim, through a GitProvider, the branches its patterns match.
                  properties:
                    branchPatterns:
                      description: |-
                        BranchPatterns are the branches an admitted GitBranch may claim, each
                        matched against the whole branch name. "*" matches any characters, "/"
                        included, so "*" alone is every branch and "main" is only main.
                        "{consumer.namespace}" and "{consumer.name}" are the GitBranch's namespace
                        and name, each a whole path segment: "teams/{consumer.namespace}/*".
                        "{consumer.name}" needs "{consumer.namespace}" in the same pattern, because
                        a GitBranch picks its own name. There is no escaping, "?" or character
                        class.
                      items:
                        description: |-
                          BranchPattern matches a whole branch name: literal text, "*" for any
                          characters including "/", and "{consumer.namespace}" and "{consumer.name}"
                          as whole path segments. "{consumer.name}" needs "{consumer.namespace}" in
                          the same pattern.
                        maxLength: 255
                        minLength: 1
                        pattern: ^[^\s~^:?\[\\]*$
                        type: string
                        x-kubernetes-validations:
                        - messageExpression: '''branch pattern '' + self + '' references
                            unknown variable '' + self.replace(''{consumer.namespace}'',
                            ''x'').replace(''{consumer.name}'', ''x'').find(''[{][^{}]*[}]'')
                            + ''; the variables are {consumer.namespace} and {consumer.name}'''
                          rule: '!self.replace(''{consumer.namespace}'', ''x'').replace(''{consumer.name}'',
                            ''x'').matches(''[{][^{}]*[}]'')'
                        - messageExpression: '''branch pattern '' + self + '' has
                            an unmatched brace; the variables are {consumer.namespace}
                            and {consumer.name}'''
                          rule: self.replace('{consumer.namespace}', 'x').replace('{consumer.name}',
                            'x').matches('[{][^{}]*[}]') || !self.replace('{consumer.namespace}',
                            'x').replace('{consumer.name}', 'x').matches('[{}]')
                        - messageExpression: '''branch pattern '' + self + '': {consumer.namespace}
                            and {consumer.name} must each be a whole path segment,
                            at the start or after a /, and at the end or before a
                            /'''
                          rule: '!self.matches(''[^/][{]consumer[.]name(space)?[}]'')
                            && !self.matches(''[{]consumer[.]name(space)?[}][^/]'')'
                        - messageExpression: '''branch pattern '' + self + '': {consumer.name}
                            needs {consumer.namespace} in the same pattern; the consumer
                            picks its own name, so on its own it would let any admitted
                            namespace claim any branch the pattern leaves open'''
                          rule: '!self.contains(''{consumer.name}'') || self.contains(''{consumer.namespace}'')'
                        - messageExpression: '''branch pattern '' + self + '' can
                            match no branch name: git refuses .., @{, a leading or
                            trailing / and //'''
                          rule: '!self.contains(''..'') && !self.contains(''@{'')
                            && !self.startsWith(''/'') && !self.endsWith(''/'') &&
                            !self.contains(''//'')'
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    consumerNamespaces:
                      description: |-
                        ConsumerNamespaces are the namespaces whose GitBranches this grant admits.
                        from: "Same" is this GitProvider's namespace.
                      properties:
                        from:
                          description: |-
                            From is where this grant admits consumers from: "Same" (the namespace of the
                            object that holds the grant), "Names" (the namespaces in names), "Selector"
                            (the namespaces whose labels match selector) or "All" (every namespace).
                          enum:
                          - Same
                          - Names
                          - Selector
                          - All
                          type: string
                        names:
                          description: 'Names are the namespaces admitted with from:
                            "Names", by exact name.'
                          items:
                            description: |-
                              GrantNamespace is a namespace a grant admits, by exact name. A variable and
                              "*" are refused.
                            maxLength: 63
                            type: string
                            x-kubernetes-validations:
                            - message: 'names: a variable is refused, because names
                                are matched against the consumer''s namespace and
                                ''{consumer.namespace}'' would admit every consumer;
                                use from: All to admit every namespace, or from: Same
                                for the namespace of the object holding the grant'
                              rule: self != '{consumer.namespace}' && self != '{consumer.name}'
                            - message: 'names: ''*'' is refused; use from: All to
                                admit every namespace'
                              rule: self != '*'
                            - message: names holds namespace names (DNS labels)
                              rule: self == '{consumer.namespace}' || self == '{consumer.name}'
                                || self == '*' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                          maxItems: 64
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        selector:
                          description: |-
                            Selector matches the labels of the namespaces admitted with from:
                            "Selector". It must not be empty: to admit every namespace, use from: "All".
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                      required:
                      - from
                      type: object
                      x-kubernetes-validations:
                      - message: 'from: Names needs names'
                        rule: self.from != 'Names' || has(self.names)
                      - message: 'names goes only with from: Names'
                        rule: '!has(self.names) || self.from == ''Names'''
                      - message: 'from: Selector needs a selector; to admit every
                          namespace, use from: All'
                        rule: self.from != 'Selector' || has(self.selector)
                      - message: 'selector goes only with from: Selector'
                        rule: '!has(self.selector) || self.from == ''Selector'''
                      - message: 'selector: {} is refused; to admit every namespace,
                          use from: All'
                        rule: '!has(self.selector) || (has(self.selector.matchLabels)
                          && size(self.selector.matchLabels) > 0) || (has(self.selector.matchExpressions)
                          && size(self.selector.matchExpressions) > 0)'
                  required:
                  - branchPatterns
                  - consumerNamespaces
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              commit:
                description: |-
                  Commit sets the committer identity and commit signing. Commit messages are
                  set on the GitTarget, in spec.commit.message.
                properties:
                  committer:
                    description: |-
                      Committer is the identity written as each commit's committer. With signing
                      enabled, its email must be a verified address of the account that owns the
                      signing key.
                    properties:
                      email:
                        default: noreply@configbutler.ai
                        description: Email is the committer email. Defaults to "noreply@configbutler.ai".
                        type: string
                      name:
                        default: GitOps Reverser
                        description: Name is the committer name. Defaults to "GitOps
                          Reverser".
                        type: string
                    type: object
                  signing:
                    description: Signing configures SSH commit signing.
                    properties:
                      generateWhenMissing:
                        default: false
                        description: |-
                          GenerateWhenMissing creates a signing key in the Secret when it holds none.
                          Defaults to false.
                        type: boolean
                      secretRef:
                        description: |-
                          SecretRef names the Secret, in this namespace, that holds the SSH signing
                          key.
                        properties:
                          name:
                            description: Name of the referent.
                            type: string
                        required:
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: commit.signing.secretRef.name must not be empty
                          rule: self.name != ''
                    required:
                    - secretRef
                    type: object
                type: object
              knownHostsRef:
                description: |-
                  KnownHostsRef names a ConfigMap or Secret, in this namespace, holding SSH
                  known_hosts, so several GitProviders on one host can share them. SSH only.
                  Host keys come from the credentials Secret's own known_hosts first, then
                  this reference, then the installation's default; without valid keys, SSH
                  fails.
                properties:
                  kind:
                    default: ConfigMap
                    description: Kind is "ConfigMap" or "Secret". Defaults to "ConfigMap".
                    enum:
                    - ConfigMap
                    - Secret
                    type: string
                  name:
                    description: |-
                      Name is the name of the ConfigMap or Secret. Its "known_hosts" key is read,
                      or "ssh_known_hosts" (the key Argo CD's argocd-ssh-known-hosts-cm uses) when
                      that is absent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              secretRef:
                description: |-
                  SecretRef names the Secret, in this namespace, that holds the credentials
                  for the repository. Omitted means anonymous access.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.secretRef.name must not be empty; omit secretRef entirely
                    for anonymous access
                  rule: self.name != ''
              url:
                description: |-
                  URL is the repository's URL, over HTTPS or SSH. Immutable: delete and
                  recreate the GitProvider to change it.
                minLength: 1
                type: string
            required:
            - url
            type: object
            x-kubernetes-validations:
            - message: spec.url is immutable; delete and recreate the GitProvider
                to point at a different repository
              rule: self.url == oldSelf.url
          status:
            description: status defines the observed state of GitProvider.
            properties:
              conditions:
                description: |-
                  Conditions are the latest observations of this GitProvider's state: whether
                  the repository answers with its credential, and whether commit signing is
                  ready. Ready, Reconciling and Stalled follow kstatus.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastVerifiedAt:
                description: |-
                  LastVerifiedAt is the time of the last successful connectivity check
                  against the repository, using this GitProvider's credentials, or
                  anonymous access when spec.secretRef is omitted. It is never cleared, and
                  a failure leaves it unchanged, so it does not show when a failure began.
                  status.conditions gives the reason the GitProvider is not ready.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              signingPublicKey:
                description: |-
                  SigningPublicKey is the SSH public key commits are signed with, in
                  authorized_keys format. Register it as a signing key with your Git host. Set
                  only when spec.commit.signing is configured and its key is available.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
