---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: fluxclaims.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: FluxClaim
    listKind: FluxClaimList
    plural: fluxclaims
    singular: fluxclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=="InControl")].reason
      name: Control
      type: string
    - jsonPath: .spec.kustomizationRef.name
      name: Kustomization
      type: string
    - jsonPath: .status.operation.phase
      name: Operation
      type: string
    - jsonPath: .status.operation.commit
      name: Commit
      priority: 1
      type: string
    - jsonPath: .spec.kubeProviderRef.name
      name: Cluster
      priority: 1
      type: string
    - jsonPath: .status.repairPending
      name: RepairPending
      priority: 1
      type: boolean
    - jsonPath: .status.previousSuspendState
      name: PreviousSuspendState
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          FluxClaim lets GitOps Reverser decide when a Flux Kustomization applies.
          The Kustomization stays suspended, and GitOps Reverser resumes it for each
          apply it starts, always after the edits pending on the branch are
          published. It starts one:

            - after a commit that GitOps Reverser did not push;
            - after a refused edit, on a GitTarget with spec.onRefusal "Reapply";
            - after an apply reverted an edit made through the API;
            - after objects were created through the API in its folders;
            - once at startup, and when a GitTarget first names this FluxClaim;
            - once spec.catchUpAfter passed since a push of GitOps Reverser's own;
            - after a SaveRequest with spec.catchUp "AfterPush" pushed a commit.

          GitTargets name it with spec.applierClaimRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of FluxClaim.
            properties:
              catchUpAfter:
                default: 1m
                description: |-
                  CatchUpAfter is how long the Kustomization stays behind the branch after
                  a push of GitOps Reverser's own before an apply of the tip is asked for,
                  as a Go duration ("1m", "90s"). Such a push changes nothing on the
                  cluster, which already holds the edit, but leaves
                  status.lastAppliedRevision and the GitRepository's artifact at the commit
                  before it. The interval starts when the Kustomization is first seen
                  behind, so a burst of saves costs one apply, and one at the tip costs
                  none. The apply can still wait for startup, a retry backoff or edits
                  being published. "0s" never asks for this reason, and drops an apply it
                  asked for that has not started. Otherwise at least "10s" and at most
                  "24h". Defaults to "1m".
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|μs|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: spec.catchUpAfter must be 0s, or a Go duration from 10s
                    to 24h
                  rule: duration(self) == duration('0s') || (duration(self) >= duration('10s')
                    && duration(self) <= duration('24h'))
              kubeProviderRef:
                description: |-
                  KubeProviderRef names the KubeProvider of the cluster that runs the
                  Kustomization, such as a management cluster running Flux. An omitted
                  namespace means this FluxClaim's namespace. The KubeProvider's
                  spec.allowedApplierClaims must admit this namespace, with the
                  Kustomization's namespace in applierNamespaces, and its identity needs get
                  and patch on the Kustomization and its GitRepository. Immutable: delete and
                  recreate the FluxClaim to change it.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent, when not specified it
                      acts as LocalObjectReference.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.kubeProviderRef.name must not be empty
                  rule: self.name != ''
                - message: spec.kubeProviderRef is immutable; delete and recreate
                    the FluxClaim to hold a Kustomization elsewhere
                  rule: self == oldSelf
              kustomizationRef:
                description: |-
                  KustomizationRef names the Flux Kustomization that applies the folders of
                  the GitTargets naming this FluxClaim. Its spec.sourceRef must be a
                  GitRepository that follows a branch. An omitted namespace means this
                  FluxClaim's namespace. Immutable: delete and recreate the FluxClaim to
                  change it.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent, when not specified it
                      acts as LocalObjectReference.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.kustomizationRef is immutable; delete and recreate
                    the FluxClaim to hold another Kustomization
                  rule: self == oldSelf
                - message: spec.kustomizationRef.name must not be empty
                  rule: self.name != ''
            required:
            - kubeProviderRef
            - kustomizationRef
            type: object
          status:
            description: status defines the observed state of FluxClaim.
            properties:
              conditions:
                description: |-
                  Conditions are the latest observations of this FluxClaim's state. Ready,
                  Reconciling and Stalled follow kstatus.

                  Configured is True when an eligible GitTarget names this FluxClaim, and the
                  Kustomization exists, applies a GitRepository that follows a branch, may be
                  patched, and no other FluxClaim holds it. An eligible GitTarget is in this
                  namespace, is admitted by its KubeProviders, and writes the branch the
                  GitRepository fetches. Of several FluxClaims for one Kustomization, the one
                  with an apply in flight holds it, then the one holding it already, then the
                  oldest; the others are Configured=False, reason HeldByAnotherClaim.

                  InControl says whether GitOps Reverser decides when the Kustomization
                  applies:

                  - True, reason Suspended: the Kustomization is suspended, and GitOps
                    Reverser starts every apply.
                  - True, reason Applying: an apply GitOps Reverser started is running;
                    the Kustomization is suspended again when it ends.
                  - False, reason Suspending: Flux has not yet handled the suspend.
                  - False, reason Releasing or Revoking: the FluxClaim is handing the
                    Kustomization back.
                  - False, reason NotReferenced: no GitTarget names this FluxClaim.
                  - Unknown, reason NotConfigured: Configured is not True, or another
                    FluxClaim holds the Kustomization.

                  A FluxClaim no GitTarget names reads nothing and is Ready=True, reason
                  NotReferenced.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              operation:
                description: |-
                  Operation is the apply GitOps Reverser started on the Kustomization: the one
                  in flight, or the last one. Absent until the first.
                properties:
                  appliedRevision:
                    description: |-
                      AppliedRevision is the revision the applier reports applying when the
                      operation completes. It can differ from commit when the branch moved between
                      the check and the apply.
                    type: string
                  commit:
                    description: |-
                      Commit is the commit the applier was asked to apply. Empty when the remote
                      did not carry the branch.
                    type: string
                  finishedAt:
                    description: FinishedAt is when the operation was seen to complete.
                    format: date-time
                    type: string
                  message:
                    description: |-
                      Message says why a Failed operation failed, or why an Unresolved one is
                      overdue.
                    type: string
                  phase:
                    description: |-
                      Phase is where the operation stands. Requested, Running, Settling (Flux
                      only: applied, and the Kustomization not yet suspended again) and Unresolved
                      (overdue, still followed) are in flight: the applier can still revert an
                      edit to an object it applies, and is asked for nothing else. Succeeded and
                      Failed are complete; Failed may have applied part of the commit.
                    enum:
                    - Requested
                    - Running
                    - Settling
                    - Unresolved
                    - Succeeded
                    - Failed
                    type: string
                  reason:
                    description: |-
                      Reason is why the apply was asked for: ForeignCommit (a commit GitOps
                      Reverser did not push), Refusal (a refused edit under spec.onRefusal:
                      "Reapply"), Repair (an earlier apply reverted a newer API edit), or CatchUp
                      (adopting objects the API created, and once at startup or when a GitTarget
                      first names the claim). With several GitTargets on the claim, it is the
                      strongest of their reasons.
                    enum:
                    - ForeignCommit
                    - Refusal
                    - Repair
                    - CatchUp
                    type: string
                  requestedAt:
                    description: RequestedAt is when the applier was asked.
                    format: date-time
                    type: string
                  suspendToken:
                    description: |-
                      SuspendToken is the reconcile.fluxcd.io/requestedAt value of the suspend
                      that follows the apply. Once the Kustomization reports it handled, nothing
                      started before the suspend is still running. Flux only.
                    type: string
                  token:
                    description: |-
                      Token identifies the request in the applier's own status: the
                      reconcile.fluxcd.io/requestedAt value on a Flux object, or the
                      "gitops-reverser request" entry in an Argo CD operation's info.
                    type: string
                required:
                - phase
                - requestedAt
                type: object
              previousSuspendState:
                description: |-
                  PreviousSuspendState is how the Kustomization stood before this FluxClaim
                  first suspended it, and what handing it back restores: one that was
                  Suspended stays suspended, one that was NotSuspended is resumed. It is
                  cleared once the Kustomization is handed back. Absent, handing it back
                  resumes the Kustomization.
                enum:
                - Suspended
                - NotSuspended
                type: string
              repairPending:
                description: |-
                  RepairPending is true while a Repair apply is pending: an apply ran a commit
                  older than an edit made through the API and reverted it on the cluster. Git
                  holds the edit, and the cluster runs the older value until the next apply.
                type: boolean
              source:
                description: |-
                  Source is the GitRepository the Kustomization applies, as last read. It is
                  published while an eligible GitTarget names this FluxClaim, and that
                  GitTarget must write the repository and branch it fetches.
                properties:
                  alsoAppliedBy:
                    description: |-
                      AlsoAppliedBy lists the other objects that apply this GitRepository and that
                      no FluxClaim holds: Kustomizations, and HelmReleases whose chart comes from
                      it. Each applies a new commit as soon as Flux fetches it. Information only;
                      it never affects Ready.
                    items:
                      description: |-
                        NamespacedObjectKindReference contains enough information to locate the typed referenced Kubernetes resource object
                        in any namespace.
                      properties:
                        apiVersion:
                          description: API version of the referent, if not specified
                            the Kubernetes preferred version will be used.
                          type: string
                        kind:
                          description: Kind of the referent.
                          type: string
                        name:
                          description: Name of the referent.
                          type: string
                        namespace:
                          description: Namespace of the referent, when not specified
                            it acts as LocalObjectReference.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  branch:
                    description: Branch is the GitRepository's spec.ref.branch.
                    type: string
                  gitRepository:
                    description: |-
                      GitRepository is the Kustomization's spec.sourceRef, with its namespace
                      filled in.
                    properties:
                      name:
                        description: Name of the referent.
                        type: string
                      namespace:
                        description: Namespace of the referent, when not specified
                          it acts as LocalObjectReference.
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    description: URL is the GitRepository's spec.url.
                    type: string
                required:
                - gitRepository
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
