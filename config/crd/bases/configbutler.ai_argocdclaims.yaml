---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: argocdclaims.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: ArgoCDClaim
    listKind: ArgoCDClaimList
    plural: argocdclaims
    singular: argocdclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=="Held")].reason
      name: Held
      type: string
    - jsonPath: .spec.applicationRef.name
      name: Application
      type: string
    - jsonPath: .status.operation.phase
      name: Operation
      type: string
    - jsonPath: .status.operation.commit
      name: Commit
      priority: 1
      type: string
    - jsonPath: .spec.kubeProviderRef.name
      name: Cluster
      priority: 1
      type: string
    - jsonPath: .status.repairPending
      name: RepairPending
      priority: 1
      type: boolean
    - jsonPath: .status.previousSuspendState
      name: PreviousSuspendState
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          ArgoCDClaim holds an Argo CD Application's automated sync off for GitOps Reverser, which starts
          every sync it runs, each after publishing the edits pending on the branch: after a commit
          GitOps Reverser did not push, after a refused edit, after a reverted edit, and to adopt what the
          API created or converge the Application (CatchUp). GitTargets name it with spec.applierClaimRef.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the Application the applier claim holds
            properties:
              applicationRef:
                description: |-
                  ApplicationRef is the Argo CD Application that applies the folders of the GitTargets naming
                  this applier claim. It must have a single spec.source whose targetRevision names a branch. The
                  applier claim holds its automated sync off: it applies spec.syncPolicy.automated.enabled: false,
                  which keeps automated.prune for the syncs GitOps Reverser starts, switches it off again when
                  somebody switches it on, and gives it up when it lets go. An Application an ApplicationSet
                  generated, or whose switch another field manager applies, must have automated sync off
                  already: the switch is theirs, and the applier claim only checks it. GitOps Reverser starts each
                  sync by setting the Application's operation, as Argo CD's automated sync does, pinned to the
                  commit it checked, and never replaces an operation that is running. Its namespace defaults to
                  the applier claim's namespace. Immutable.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent, when not specified it
                      acts as LocalObjectReference.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.applicationRef is immutable; delete and recreate the
                    ArgoCDClaim to hold another Application
                  rule: self == oldSelf
                - message: spec.applicationRef.name must not be empty
                  rule: self.name != ''
              clusterProviderRef:
                description: |-
                  RemovedClusterProviderRef is the replaced spelling of kubeProviderRef. It is never read;
                  setting it is refused.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
              kubeProviderRef:
                description: |-
                  KubeProviderRef names the KubeProvider whose cluster holds the Application, such as a
                  management cluster running Argo CD for the source cluster. Namespace omitted means this
                  applier claim's own namespace. The provider's spec.allowedApplierClaims must admit this applier
                  claim's namespace, with the Application's namespace in applierNamespaces. Its identity needs
                  get, update and patch on the Application. Immutable.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent, when not specified it
                      acts as LocalObjectReference.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.kubeProviderRef.name must not be empty
                  rule: self.name != ''
                - message: spec.kubeProviderRef is immutable; delete and recreate
                    the ArgoCDClaim to hold an Application elsewhere
                  rule: self == oldSelf
            required:
            - applicationRef
            - kubeProviderRef
            type: object
            x-kubernetes-validations:
            - message: spec.clusterProviderRef was replaced by spec.kubeProviderRef,
                which names a namespaced KubeProvider
              rule: '!has(self.clusterProviderRef)'
          status:
            description: status defines the observed state of ArgoCDClaim
            properties:
              conditions:
                description: |-
                  Conditions are Configured (an eligible GitTarget names the applier claim; the Application exists,
                  syncs a single source, has automated sync off or a switch the applier claim may hold, may be
                  written, and no other ArgoCDClaim holds it), Held (AutomatedSyncOff: automated sync is off,
                  held by GitOps Reverser or kept off by the switch's owner; Releasing: being handed back;
                  NotReferenced; NotConfigured), and the kstatus Ready/Reconciling/Stalled trio. An applier claim acts only while an
                  eligible GitTarget references it: one in its namespace that names it, is admitted by its
                  KubeProviders, and writes the repository and branch the Application syncs. An applier claim no
                  GitTarget names reads nothing in the Application's cluster and is Configured=Unknown,
                  Ready=True, both NotReferenced; one named only by GitTargets that are not eligible is
                  Configured NotBound or a refusal. Of the ArgoCDClaims in line for one Application in one
                  cluster, one holds it: the one holding it already, then the one created first. The others are
                  Configured=False (HeldByAnotherClaim) until it lets go, and the next in line takes it over.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              operation:
                description: |-
                  Operation is the sync GitOps Reverser started on the Application: the one in flight, or the
                  last one. Absent until the first.
                properties:
                  appliedRevision:
                    description: |-
                      AppliedRevision is the revision the applier reports it applied once the operation completed.
                      It can differ from commit when the branch moved between the check and the apply.
                    type: string
                  commit:
                    description: |-
                      Commit is the commit the applier was asked to apply. Empty when the remote did not carry the
                      branch.
                    type: string
                  finishedAt:
                    description: FinishedAt is when the operation was seen to complete.
                    format: date-time
                    type: string
                  message:
                    description: Message says why a Failed operation failed, or why
                      an Unresolved one is overdue.
                    type: string
                  phase:
                    description: |-
                      Phase is where the operation stands. Requested, Running, Settling and Unresolved are in
                      flight: while one is, an edit to an object the applier applies can still be reverted by it,
                      and the applier is asked nothing else. Succeeded and Failed have completed.
                    enum:
                    - Requested
                    - Running
                    - Settling
                    - Unresolved
                    - Succeeded
                    - Failed
                    type: string
                  reason:
                    description: |-
                      Reason is why the apply was asked for. With several GitTargets on the applier claim, it is the
                      strongest of their reasons.
                    enum:
                    - ForeignCommit
                    - Refusal
                    - Repair
                    - CatchUp
                    type: string
                  requestedAt:
                    description: RequestedAt is when the applier was asked.
                    format: date-time
                    type: string
                  suspendToken:
                    description: |-
                      SuspendToken is the reconcile.fluxcd.io/requestedAt value the suspend after the apply carried.
                      Once the Kustomization reports it handled, nothing started before the suspend is still
                      running. Flux only.
                    type: string
                  token:
                    description: |-
                      Token identifies the request in the applier's own status: the reconcile.fluxcd.io/requestedAt
                      value on a Flux object, or the "gitops-reverser request" entry in an Argo CD operation's info.
                    type: string
                required:
                - phase
                - requestedAt
                type: object
              previousSuspendState:
                description: |-
                  PreviousSuspendState is how the Application stood before the applier claim first switched its
                  automated sync off, which handing it back restores: NotSuspended (automated sync was on) or
                  Suspended (it was off). Recorded with the first switch-off, and cleared once the Application is
                  handed back. Absent, a hand-back gives the switch up and leaves what the Application's own spec
                  says. Either way, a switch that an ApplicationSet or another field manager owns by then keeps
                  the value that owner set.
                enum:
                - Suspended
                - NotSuspended
                type: string
              repairPending:
                description: |-
                  RepairPending is true while a Repair sync is pending for the Application: a sync reverted an
                  API edit made after its flush, so the cluster runs an older value than Git until the
                  next sync.
                type: boolean
              source:
                description: |-
                  Source is the Application's spec.source, as last read, published while an eligible GitTarget
                  references the applier claim. A GitTarget naming this applier claim must write the repository it syncs, on
                  the branch its targetRevision names.
                properties:
                  repoURL:
                    description: RepoURL is the Application's spec.source.repoURL.
                    type: string
                  targetRevision:
                    description: |-
                      TargetRevision is the Application's spec.source.targetRevision, as written: a branch name, or
                      refs/heads/ and the name. Empty is Argo CD's HEAD.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
