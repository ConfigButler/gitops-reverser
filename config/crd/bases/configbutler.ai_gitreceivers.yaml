---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: gitreceivers.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: GitReceiver
    listKind: GitReceiverList
    plural: gitreceivers
    singular: gitreceiver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.webhookPath
      name: Path
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          GitReceiver is the endpoint a Git host notifies when it receives a push. A
          delivery wakes every GitBranch of every GitProvider, in any namespace, whose
          spec.url names the delivery's repository, so pushes are picked up at once
          instead of at the next refresh. A GitProvider that reaches the host through
          another host name or port is not matched. A delivery is only a hint: the
          branch is then read with its own GitProvider's credential, so a delivery
          cannot choose a URL, a credential or a commit.
          GitBranch.status.lastPushNoticeAt shows deliveries arriving.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GitReceiver.
            properties:
              secretRef:
                description: |-
                  SecretRef names the Secret, in this namespace, whose "token" key is the
                  webhook secret. The token also determines status.webhookPath, so rotating it
                  moves the path: register the new path with the new secret.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.secretRef.name must not be empty
                  rule: self.name != ''
              type:
                description: |-
                  Type is the payload and signature the Git host sends: "github"
                  (X-Hub-Signature-256), "gitlab" (X-Gitlab-Token), "gitea"
                  (X-Gitea-Signature), or "generic-hmac" for a relay of your own (X-Signature:
                  sha256=<hex HMAC of the body>, over a {"repository", "branch", "after"}
                  body).
                enum:
                - github
                - gitlab
                - gitea
                - generic-hmac
                type: string
            required:
            - secretRef
            - type
            type: object
          status:
            description: status defines the observed state of GitReceiver.
            properties:
              conditions:
                description: |-
                  Conditions are the latest observations of this GitReceiver's state. Ready,
                  Reconciling and Stalled follow kstatus; Ready is True once the token is
                  readable and the receiver listener is on.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              webhookPath:
                description: |-
                  WebhookPath is the path this GitReceiver is served on, under the receiver
                  listener: /git-push/ and an HMAC of its namespace and name, keyed by the
                  token. Point the Git host's push webhook at the listener's address plus this
                  path. Empty while the token is missing.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
