---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: gitreceivers.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: GitReceiver
    listKind: GitReceiverList
    plural: gitreceivers
    singular: gitreceiver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.webhookPath
      name: Path
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          GitReceiver is the endpoint a Git host notifies on a push. A delivery to it authenticates against
          its token, names a repository and a branch, and wakes the branch worker of each GitProvider that
          references this GitReceiver for that repository and branch. A delivery is only a hint: the branch
          worker reads the remote with its own provider's credential to find out what happened, so nothing
          a delivery says can choose a URL, a credential or a commit.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GitReceiver
            properties:
              accessFrom:
                description: |-
                  AccessFrom admits GitProviders in OTHER namespaces to reference this GitReceiver from
                  spec.gitReceiverRef. Its own namespace is always admitted; omitted, no other namespace is.
                  One GitReceiver can then serve a GitHub App or an organization webhook, whose one endpoint
                  delivers for repositories whose GitProviders live in many namespaces.
                properties:
                  names:
                    description: |-
                      Names is an explicit allow-list of namespace names. Entries are namespace names (DNS-1123
                      labels), never patterns — `*` is rejected. To admit every namespace, declare `selector: {}`.
                    items:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  selector:
                    description: |-
                      Selector is a label selector matched against Namespace labels; a namespace whose labels
                      match is admitted. ORed with Names.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              secretRef:
                description: |-
                  SecretRef names a Secret in this GitReceiver's namespace whose "token" key is the webhook
                  secret. The token also derives status.webhookPath, so rotating it moves the path: register the
                  new path with the new secret.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.secretRef.name must not be empty
                  rule: self.name != ''
              type:
                description: |-
                  Type is the payload and signature the Git host sends. "github" checks X-Hub-Signature-256,
                  "gitlab" checks X-Gitlab-Token, "gitea" checks X-Gitea-Signature, and "generic-hmac" checks
                  X-Signature: sha256=<hex HMAC of the body> over a {"repository", "branch", "after"} body,
                  for a relay of your own.
                enum:
                - github
                - gitlab
                - gitea
                - generic-hmac
                type: string
            required:
            - secretRef
            - type
            type: object
          status:
            description: status defines the observed state of GitReceiver
            properties:
              conditions:
                description: |-
                  Conditions report whether this GitReceiver serves deliveries: the Ready summary plus the
                  kstatus Reconciling/Stalled pair. Ready is True once the token Secret is readable and the
                  receiver listener is on.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              webhookPath:
                description: |-
                  WebhookPath is the path this GitReceiver is served on, under the receiver listener:
                  /git-push/ and an HMAC of this GitReceiver's namespace and name, keyed by the token. Point the
                  Git host's push webhook at the listener plus this path. Empty while the token Secret or its
                  "token" key is missing.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
