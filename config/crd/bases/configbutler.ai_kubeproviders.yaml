  names:
    kind: KubeProvider
    listKind: KubeProviderList
    plural: kubeproviders
    singular: kubeprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=="AuditFactsReceived")].status
