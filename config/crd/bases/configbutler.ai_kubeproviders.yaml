    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          KubeProvider is a connection to a Kubernetes cluster and the identity used there. A GitTarget
          mirrors from it; an applier claim reaches its applier through it. It holds the credential that
          reaches it (a kubeconfig Secret in its own namespace, or the operator's own identity where the
          installation allows it), who may use it and for what (spec.allowedGitTargets and
          spec.allowedApplierClaims), and the audit route its attribution facts are partitioned under.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of KubeProvider.
            properties:
              allowedApplierClaims:
                default:
                - applierNamespaces:
                  - '{consumer.namespace}'
                  consumerNamespaces:
                    from: Same
                description: |-
                  AllowedApplierClaims says which applier claims (FluxClaims and ArgoCDClaims) may hold an applier
                  through this provider, and in which namespaces that applier may live (applierNamespaces).
                  Admission to mirror does not admit to apply. Omitted, it defaults to one grant for this
                  KubeProvider's own namespace, holding appliers in the namespace of the same name
                  (consumerNamespaces: {from: Same}, applierNamespaces: ["{consumer.namespace}"]). A list you
                  write is the whole policy: nothing is added to it, and [] admits no applier claim. Grants
                  combine by union.
                items:
                  description: |-
                    KubeProviderApplierClaimGrant admits applier claims in some control-cluster namespaces to hold an
                    applier through a KubeProvider, and bounds where that applier may live.
                  properties:
                    applierNamespaces:
                      description: |-
                        ApplierNamespaces are namespaces in this provider's cluster in which an admitted applier claim's
                        Kustomization or Application may live: exact names, '{consumer.namespace}' for the namespace
                        named like the applier claim's, or '*' for every namespace.

                        The effective scope is the union of applierNamespaces from all grants admitting the applier
                        claim, after expanding variables. This is a permission, not a selection: it is checked against
                        one namespace, that of the applier claim's kustomizationRef or applicationRef. The check runs
                        when the applier claim reconciles, and again when a grant changes, never at admission. An
                        applier outside the union is refused, in the applier claim's status
                        (ApplierNamespaceNotAllowed), and an applier claim holding it hands it back.
                      items:
                        description: |-
                          ScopeNamespace is one namespace in a source or applier scope: a namespace name,
                          "{consumer.namespace}" for the namespace of the same name as the consumer's, or "*" for every
                          namespace.
                        maxLength: 63
                        type: string
                        x-kubernetes-validations:
                        - message: '''{consumer.name}'' is refused in a namespace
                            scope: the consumer picks its own name, so any namespace
                            could be reached by naming an object after it; use ''{consumer.namespace}'',
                            namespace names, or ''*'''
                          rule: self != '{consumer.name}'
                        - message: a namespace scope holds a namespace name, '{consumer.namespace}'
                            alone, or '*' alone
                          rule: self == '*' || self == '{consumer.namespace}' || self
                            == '{consumer.name}' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    consumerNamespaces:
                      description: |-
                        ConsumerNamespaces are the control-cluster namespaces whose applier claims this grant admits.
                        from: Same is this KubeProvider's namespace.
                      properties:
                        from:
                          description: |-
                            From is where this grant admits from: Same (the namespace of the object holding the grant, not
                            the consumer's), Names (the namespaces in names), Selector (the namespaces whose labels match
                            selector) or All (every namespace).
                          enum:
                          - Same
                          - Names
                          - Selector
                          - All
                          type: string
                        names:
                          description: 'Names are the control-cluster namespaces admitted
                            with from: Names, by exact name.'
                          items:
                            description: GrantNamespace is one control-cluster namespace
                              a grant admits by name.
                            maxLength: 63
                            type: string
                            x-kubernetes-validations:
                            - message: 'names: a variable is refused, because names
                                are matched against the consumer''s namespace and
                                ''{consumer.namespace}'' would admit every consumer;
                                use from: All to admit every namespace, or from: Same
                                for the namespace of the object holding the grant'
                              rule: self != '{consumer.namespace}' && self != '{consumer.name}'
                            - message: 'names: ''*'' is refused; use from: All to
                                admit every namespace'
                              rule: self != '*'
                            - message: names holds namespace names (DNS labels)
                              rule: self == '{consumer.namespace}' || self == '{consumer.name}'
                                || self == '*' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                          maxItems: 64
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        selector:
                          description: |-
                            Selector matches labels on control-cluster Namespaces, with from: Selector. It must select
                            something: to admit every namespace, use from: All.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                      required:
                      - from
                      type: object
                      x-kubernetes-validations:
                      - message: 'from: Names needs names'
                        rule: self.from != 'Names' || has(self.names)
                      - message: 'names goes only with from: Names'
                        rule: '!has(self.names) || self.from == ''Names'''
                      - message: 'from: Selector needs a selector; to admit every
                          namespace, use from: All'
                        rule: self.from != 'Selector' || has(self.selector)
                      - message: 'selector goes only with from: Selector'
                        rule: '!has(self.selector) || self.from == ''Selector'''
                      - message: 'selector: {} is refused; to admit every namespace,
                          use from: All'
                        rule: '!has(self.selector) || (has(self.selector.matchLabels)
                          && size(self.selector.matchLabels) > 0) || (has(self.selector.matchExpressions)
                          && size(self.selector.matchExpressions) > 0)'
                  required:
                  - applierNamespaces
                  - consumerNamespaces
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              allowedGitTargets:
                default:
                - consumerNamespaces:
                    from: Same
                  sourceNamespaces:
                  - '{consumer.namespace}'
                description: |-
                  AllowedGitTargets says which GitTargets may mirror through this provider, and what: each grant
                  admits some control-cluster namespaces and bounds what the WatchRules feeding a GitTarget there
                  may watch (sourceNamespaces), and what a ClusterWatchRule may mirror through it
                  (clusterResources). Omitted, it defaults to one grant for this KubeProvider's own namespace,
                  mirroring the namespace of the same name (consumerNamespaces: {from: Same}, sourceNamespaces:
                  ["{consumer.namespace}"]); it grants no cluster-scoped resource. A list you write is the whole
                  policy: nothing is added to it, and [] admits no GitTarget. Grants combine by union.
                items:
                  description: |-
                    KubeProviderGitTargetGrant admits GitTargets in some control-cluster namespaces to mirror through a
                    KubeProvider, and bounds what they may mirror.
                  properties:
                    clusterResources:
                      description: |-
                        ClusterResources are the cluster-scoped resource types a ClusterWatchRule may mirror through an
                        admitted GitTarget: resource.group (clusterroles.rbac.authorization.k8s.io), a bare resource for
                        the core group only (nodes), or '*' for every one, including CRDs installed later. An identity
                        covers every served version. Omitted, this grant gives none.

                        The effective scope is the union of clusterResources from all grants admitting the GitTarget.
                        This is a permission, not a selection: listing a type mirrors nothing until a ClusterWatchRule
                        asks for it. A ClusterWatchRule item with '*' in apiGroups or resources needs '*' in at least
                        one admitting grant; otherwise it is refused, never narrowed to the types listed. The check runs
                        when the ClusterWatchRule reconciles, never at admission, and a rule asking for any type outside
                        the union is refused as a whole, in its status (ClusterResourceNotAllowed).
                      items:
                        description: |-
                          ClusterResourceIdentity names a cluster-scoped resource type: resource.group, a bare resource for
                          the core group, or "*" for every one.
                        maxLength: 317
                        pattern: ^(\*|[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)$
                        type: string
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    consumerNamespaces:
                      description: |-
                        ConsumerNamespaces are the control-cluster namespaces whose GitTargets this grant admits.
                        from: Same is this KubeProvider's namespace.
                      properties:
                        from:
                          description: |-
                            From is where this grant admits from: Same (the namespace of the object holding the grant, not
                            the consumer's), Names (the namespaces in names), Selector (the namespaces whose labels match
                            selector) or All (every namespace).
                          enum:
                          - Same
                          - Names
                          - Selector
                          - All
                          type: string
                        names:
                          description: 'Names are the control-cluster namespaces admitted
                            with from: Names, by exact name.'
                          items:
                            description: GrantNamespace is one control-cluster namespace
                              a grant admits by name.
                            maxLength: 63
                            type: string
                            x-kubernetes-validations:
                            - message: 'names: a variable is refused, because names
                                are matched against the consumer''s namespace and
                                ''{consumer.namespace}'' would admit every consumer;
                                use from: All to admit every namespace, or from: Same
                                for the namespace of the object holding the grant'
                              rule: self != '{consumer.namespace}' && self != '{consumer.name}'
                            - message: 'names: ''*'' is refused; use from: All to
                                admit every namespace'
                              rule: self != '*'
                            - message: names holds namespace names (DNS labels)
                              rule: self == '{consumer.namespace}' || self == '{consumer.name}'
                                || self == '*' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                          maxItems: 64
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        selector:
                          description: |-
                            Selector matches labels on control-cluster Namespaces, with from: Selector. It must select
                            something: to admit every namespace, use from: All.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                      required:
                      - from
                      type: object
                      x-kubernetes-validations:
                      - message: 'from: Names needs names'
                        rule: self.from != 'Names' || has(self.names)
                      - message: 'names goes only with from: Names'
                        rule: '!has(self.names) || self.from == ''Names'''
                      - message: 'from: Selector needs a selector; to admit every
                          namespace, use from: All'
                        rule: self.from != 'Selector' || has(self.selector)
                      - message: 'selector goes only with from: Selector'
                        rule: '!has(self.selector) || self.from == ''Selector'''
                      - message: 'selector: {} is refused; to admit every namespace,
                          use from: All'
                        rule: '!has(self.selector) || (has(self.selector.matchLabels)
                          && size(self.selector.matchLabels) > 0) || (has(self.selector.matchExpressions)
                          && size(self.selector.matchExpressions) > 0)'
                    sourceNamespaces:
                      description: |-
                        SourceNamespaces are source-cluster namespaces that a WatchRule feeding an admitted GitTarget may
                        name in rules[].sourceNamespace. Entries are exact names, '{consumer.namespace}' for the
                        namespace named like the GitTarget's, or '*'. Omitted, this grant gives no namespace.

                        The effective scope is the union of sourceNamespaces from all grants admitting the GitTarget,
                        after expanding variables. Every WatchRule item must be allowed by that union, an omitted
                        sourceNamespace included (it names the WatchRule's own namespace). This is a permission, not a
                        selection: listing a namespace watches nothing until a WatchRule names it.

                        It is not a filter on "*". A rule item with sourceNamespace "*" needs '*' in at least one
                        admitting grant; otherwise it is refused, never narrowed to the namespaces listed. With '*'
                        granted, such an item is one cluster-wide watch, bounded only by this KubeProvider credential's
                        RBAC.

                        The check runs when the WatchRule reconciles, and again when a grant changes, never at
                        admission. A WatchRule with any item outside the union is refused as a whole, in its status
                        (SourceNamespaceNotAllowed), and watches nothing. The scope bounds what is read, never where
                        objects are written in Git, and the credential's RBAC still applies inside it.
                      items:
                        description: |-
                          ScopeNamespace is one namespace in a source or applier scope: a namespace name,
                          "{consumer.namespace}" for the namespace of the same name as the consumer's, or "*" for every
                          namespace.
                        maxLength: 63
                        type: string
                        x-kubernetes-validations:
                        - message: '''{consumer.name}'' is refused in a namespace
                            scope: the consumer picks its own name, so any namespace
                            could be reached by naming an object after it; use ''{consumer.namespace}'',
                            namespace names, or ''*'''
                          rule: self != '{consumer.name}'
                        - message: a namespace scope holds a namespace name, '{consumer.namespace}'
                            alone, or '*' alone
                          rule: self == '*' || self == '{consumer.namespace}' || self
                            == '{consumer.name}' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - consumerNamespaces
                  type: object
                  x-kubernetes-validations:
                  - message: a grant in allowedGitTargets sets sourceNamespaces, clusterResources,
                      or both; one that grants neither grants nothing
                    rule: has(self.sourceNamespaces) || has(self.clusterResources)
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              attribution:
                description: |-
                  Attribution groups this cluster's author-attribution settings. The block is spelled
                  "attribution" rather than "authorAttribution" even though the operator flags are
                  --author-attribution-*: the prefix groups a flat flag namespace, and a block on a
                  source-cluster object already supplies that scope.
                properties:
                  auditRoute:
                    description: |-
                      AuditRoute is the route this cluster's audit events arrive on. The sender is the API server's
                      webhook backend (https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/#webhook-backend),
                      and this is the <route> segment its configured URL ends in: /audit-webhook/<route>. When
                      several logical clusters share one backend it is instead the value of the audit-event
                      annotation named by --author-attribution-audit-route-annotation-key.

                      It partitions the attribution facts, so two KubeProviders carrying the same route read one
                      cluster's facts, and two carrying different routes can never cross-credit an author.

                      Empty means <namespace>.<name>, which no provider in another namespace can resolve to. Set it
                      when several KubeProviders in this namespace name one cluster, since an API server has one
                      webhook backend and so posts under one route. A route is held by one namespace: providers in
                      another namespace that carry it report Stalled=True with reason AuditRouteConflict and are not
                      used. The namespace a route starts with (<namespace>.) holds it when a provider there carries
                      it; otherwise the namespace of the oldest provider carrying it does.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                type: object
              client:
                description: |-
                  Client overrides the operator's outgoing kube-client throttles for this cluster. Omitted,
                  the built-in defaults apply (20 QPS, burst 30). Refused beside inCluster.
                properties:
                  burst:
                    description: |-
                      Burst overrides the operator's outgoing kube-client burst for this cluster. Omitted, the
                      built-in default of 30 applies.
                    format: int32
                    minimum: 1
                    type: integer
                  qps:
                    description: |-
                      QPS overrides the operator's outgoing kube-client query-per-second throttle for this
                      cluster's watches and discovery. Omitted, the built-in default of 20 applies.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              inCluster:
                description: |-
                  InCluster makes this provider use the operator's own identity in the cluster it runs in. It is
                  honored only for a KubeProvider the installation lists in --in-cluster-kube-providers; any
                  other reports Stalled=True with reason InClusterNotAuthorized and is never used. Exactly one
                  of secretRef and inCluster is set. Immutable.
                type: object
              secretRef:
                description: |-
                  SecretRef names a Secret in this KubeProvider's namespace holding a kubeconfig for the source
                  cluster. When key is empty the kubeconfig is read from "value", then "value.yaml" (Flux's
                  order). Unsafe kubeconfigs (exec auth, insecure-skip-tls-verify, credentials named by file
                  path) are refused with Validated=False unless the operator opts in through its flags.
                  Exactly one of secretRef and inCluster is set. Immutable.
                properties:
                  key:
                    description: Key in the Secret, when not specified an implementation-specific
                      default key is used.
                    type: string
                  name:
                    description: Name of the Secret.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.secretRef.name must not be empty
                  rule: size(self.name) > 0
            type: object
            x-kubernetes-validations:
            - message: set exactly one of spec.secretRef and spec.inCluster
              rule: has(self.secretRef) != has(self.inCluster)
            - message: 'spec.client is refused beside spec.inCluster: the operator''s
                own client is not throttled per provider'
              rule: '!has(self.inCluster) || !has(self.client)'
            - message: spec.secretRef and spec.inCluster are immutable; delete and
                recreate the KubeProvider to point it at a different cluster
              rule: has(self.inCluster) == has(oldSelf.inCluster) && (!has(self.secretRef)
                || self.secretRef == oldSelf.secretRef)
          status:
            description: status defines the observed state of KubeProvider.
            properties:
              auditRoute:
                description: |-
                  AuditRoute is the route this provider's attribution facts are partitioned under, as resolved:
                  spec.attribution.auditRoute, or <namespace>.<name> when that is empty. It is the route the
                  AuditFactsReceived condition describes, so when it changes that condition starts over —
                  proof that one route delivered says nothing about another.
                type: string
              conditions:
                description: |-
                  Conditions report the provider's readiness: Validated (the credential is safe and
                  resolvable, asserted without a network dial) plus the aggregated Ready and the kstatus
                  Reconciling/Stalled pair. Stalled=True with reason InClusterNotAuthorized or
                  AuditRouteConflict means the provider is not used at all.

                  AuditFactsReceived reports whether an attribution fact has ever been accepted and recorded on
                  this provider's audit route. It is True (Received) from the first one on and never goes back:
                  later silence is a quiet cluster, not a fault. Until then it is Unknown, with the reason
                  naming which silence it is and therefore where to look: TransportUnavailable (the fact
                  transport is refusing writes, so no route can be judged), NoAuditDelivery (nothing is posting
                  audit to this operator at all), or RouteUnused (audit is arriving and has never carried this
                  route). It is absent when the operator runs with author attribution disabled. It is not part
                  of Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
