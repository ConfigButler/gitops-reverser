apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: kubeproviders.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: KubeProvider
    listKind: KubeProviderList
    plural: kubeproviders
    singular: kubeprovider
  scope: Namespaced
  versions:
