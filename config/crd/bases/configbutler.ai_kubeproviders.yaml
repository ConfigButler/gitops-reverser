    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          KubeProvider is a connection to a Kubernetes cluster and the identity used
          there: a kubeconfig Secret in its namespace, or the operator's own identity
          where the installation allows it. GitTargets mirror from it and applier
          claims reach their applier through it, as its spec.allowedGitTargets and
          spec.allowedApplierClaims allow.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of KubeProvider.
            properties:
              allowedApplierClaims:
                default:
                - applierNamespaces:
                  - '{consumer.namespace}'
                  consumerNamespaces:
                    from: Same
                description: |-
                  AllowedApplierClaims says which FluxClaims and ArgoCDClaims may hold an
                  applier through this KubeProvider, and in which namespaces that applier
                  may be (applierNamespaces). A namespace in allowedGitTargets gets no
                  applier access from that.

                  - Omitted: the claims in this KubeProvider's namespace, holding appliers
                    in the namespace of the same name.
                  - Empty list ([]): no claim.
                  - A list of grants: the claims that at least one grant allows, holding
                    appliers in the applierNamespaces of every grant that allows them.

                  A list replaces the default: the claims in this namespace keep access
                  only if at least one grant allows them.
                items:
                  description: |-
                    KubeProviderApplierClaimGrant admits the FluxClaims and ArgoCDClaims of some
                    namespaces to hold an applier through a KubeProvider, and bounds the
                    namespaces that applier may be in.
                  properties:
                    applierNamespaces:
                      description: |-
                        ApplierNamespaces are the namespaces, in this KubeProvider's cluster, where
                        the Kustomization or Application of an admitted applier claim may be: exact
                        names, "{consumer.namespace}" for the namespace named like the claim's, or
                        "*" for every namespace. The scope is the union over every grant admitting
                        the claim, checked when the claim reconciles and when a grant changes. An
                        applier outside it is refused (ApplierNamespaceNotAllowed), and a claim
                        holding it hands it back.
                      items:
                        description: |-
                          ScopeNamespace is a namespace in a grant's scope: a name,
                          "{consumer.namespace}" for the namespace named like the consumer's, or "*"
                          for every namespace.
                        maxLength: 63
                        type: string
                        x-kubernetes-validations:
                        - message: '''{consumer.name}'' is refused in a namespace
                            scope: the consumer picks its own name, so any namespace
                            could be reached by naming an object after it; use ''{consumer.namespace}'',
                            namespace names, or ''*'''
                          rule: self != '{consumer.name}'
                        - message: a namespace scope holds a namespace name, '{consumer.namespace}'
                            alone, or '*' alone
                          rule: self == '*' || self == '{consumer.namespace}' || self
                            == '{consumer.name}' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    consumerNamespaces:
                      description: |-
                        ConsumerNamespaces are the namespaces whose FluxClaims and ArgoCDClaims this
                        grant admits. from: "Same" is this KubeProvider's namespace.
                      properties:
                        from:
                          description: |-
                            From selects which namespaces this grant allows consumers from:

                            - "Same": the namespace of the object that holds the grant.
                            - "Names": the namespaces listed in names.
                            - "Selector": the namespaces whose labels match selector.
                            - "All": every namespace.
                          enum:
                          - Same
                          - Names
                          - Selector
                          - All
                          type: string
                        names:
                          description: 'Names are the namespaces allowed with from:
                            "Names", by exact name.'
                          items:
                            description: |-
                              GrantNamespace is a namespace a grant admits, by exact name. A variable and
                              "*" are refused.
                            maxLength: 63
                            type: string
                            x-kubernetes-validations:
                            - message: 'names: a variable is refused, because names
                                are matched against the consumer''s namespace and
                                ''{consumer.namespace}'' would admit every consumer;
                                use from: All to admit every namespace, or from: Same
                                for the namespace of the object holding the grant'
                              rule: self != '{consumer.namespace}' && self != '{consumer.name}'
                            - message: 'names: ''*'' is refused; use from: All to
                                admit every namespace'
                              rule: self != '*'
                            - message: names holds namespace names (DNS labels)
                              rule: self == '{consumer.namespace}' || self == '{consumer.name}'
                                || self == '*' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                          maxItems: 64
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        selector:
                          description: |-
                            Selector matches the labels of the namespaces allowed with from:
                            "Selector". It must not be empty: to allow every namespace, use from:
                            "All".
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                      required:
                      - from
                      type: object
                      x-kubernetes-validations:
                      - message: 'from: Names needs names'
                        rule: self.from != 'Names' || has(self.names)
                      - message: 'names goes only with from: Names'
                        rule: '!has(self.names) || self.from == ''Names'''
                      - message: 'from: Selector needs a selector; to admit every
                          namespace, use from: All'
                        rule: self.from != 'Selector' || has(self.selector)
                      - message: 'selector goes only with from: Selector'
                        rule: '!has(self.selector) || self.from == ''Selector'''
                      - message: 'selector: {} is refused; to admit every namespace,
                          use from: All'
                        rule: '!has(self.selector) || (has(self.selector.matchLabels)
                          && size(self.selector.matchLabels) > 0) || (has(self.selector.matchExpressions)
                          && size(self.selector.matchExpressions) > 0)'
                  required:
                  - applierNamespaces
                  - consumerNamespaces
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              allowedGitTargets:
                default:
                - consumerNamespaces:
                    from: Same
                  sourceNamespaces:
                  - '{consumer.namespace}'
                description: |-
                  AllowedGitTargets says which GitTargets may mirror through this
                  KubeProvider, and what. Each grant allows the GitTargets of some
                  namespaces, bounds which source namespaces their WatchRules may read
                  (sourceNamespaces), and lists the cluster-scoped types their
                  ClusterWatchRules may mirror (clusterResources).

                  - Omitted: the GitTargets in this KubeProvider's namespace, reading only
                    the source namespace of the same name and no cluster-scoped type.
                  - Empty list ([]): no GitTarget.
                  - A list of grants: the GitTargets that at least one grant allows, with
                    what every grant that allows them permits.

                  A list replaces the default: the GitTargets in this namespace keep access
                  only if at least one grant allows them.
                items:
                  description: |-
                    KubeProviderGitTargetGrant admits the GitTargets of some namespaces to
                    mirror through a KubeProvider, and bounds what they may read. It sets
                    sourceNamespaces, clusterResources, or both.
                  properties:
                    clusterResources:
                      description: |-
                        ClusterResources are the cluster-scoped types that the ClusterWatchRules of
                        an admitted GitTarget may mirror: resource.group
                        ("clusterroles.rbac.authorization.k8s.io"), a bare resource for the core
                        group ("nodes"), or "*" for every type, including CRDs installed later. Each
                        covers every served version. Omitted, this grant gives none.

                        The scope is the union over every grant admitting the GitTarget, and mirrors
                        nothing until a ClusterWatchRule asks for a type. A rule with "*" in
                        apiGroups or resources needs "*" in a grant, and is refused, not narrowed,
                        without it. A ClusterWatchRule asking for any type outside the scope is
                        refused as a whole (ClusterResourceNotAllowed) when it reconciles.
                      items:
                        description: |-
                          ClusterResourceIdentity is a cluster-scoped resource type: resource.group, a
                          bare resource for the core group, or "*" for every type.
                        maxLength: 317
                        pattern: ^(\*|[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)$
                        type: string
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    consumerNamespaces:
                      description: |-
                        ConsumerNamespaces are the namespaces whose GitTargets this grant admits.
                        from: "Same" is this KubeProvider's namespace.
                      properties:
                        from:
                          description: |-
                            From selects which namespaces this grant allows consumers from:

                            - "Same": the namespace of the object that holds the grant.
                            - "Names": the namespaces listed in names.
                            - "Selector": the namespaces whose labels match selector.
                            - "All": every namespace.
                          enum:
                          - Same
                          - Names
                          - Selector
                          - All
                          type: string
                        names:
                          description: 'Names are the namespaces allowed with from:
                            "Names", by exact name.'
                          items:
                            description: |-
                              GrantNamespace is a namespace a grant admits, by exact name. A variable and
                              "*" are refused.
                            maxLength: 63
                            type: string
                            x-kubernetes-validations:
                            - message: 'names: a variable is refused, because names
                                are matched against the consumer''s namespace and
                                ''{consumer.namespace}'' would admit every consumer;
                                use from: All to admit every namespace, or from: Same
                                for the namespace of the object holding the grant'
                              rule: self != '{consumer.namespace}' && self != '{consumer.name}'
                            - message: 'names: ''*'' is refused; use from: All to
                                admit every namespace'
                              rule: self != '*'
                            - message: names holds namespace names (DNS labels)
                              rule: self == '{consumer.namespace}' || self == '{consumer.name}'
                                || self == '*' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                          maxItems: 64
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        selector:
                          description: |-
                            Selector matches the labels of the namespaces allowed with from:
                            "Selector". It must not be empty: to allow every namespace, use from:
                            "All".
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                      required:
                      - from
                      type: object
                      x-kubernetes-validations:
                      - message: 'from: Names needs names'
                        rule: self.from != 'Names' || has(self.names)
                      - message: 'names goes only with from: Names'
                        rule: '!has(self.names) || self.from == ''Names'''
                      - message: 'from: Selector needs a selector; to admit every
                          namespace, use from: All'
                        rule: self.from != 'Selector' || has(self.selector)
                      - message: 'selector goes only with from: Selector'
                        rule: '!has(self.selector) || self.from == ''Selector'''
                      - message: 'selector: {} is refused; to admit every namespace,
                          use from: All'
                        rule: '!has(self.selector) || (has(self.selector.matchLabels)
                          && size(self.selector.matchLabels) > 0) || (has(self.selector.matchExpressions)
                          && size(self.selector.matchExpressions) > 0)'
                    sourceNamespaces:
                      description: |-
                        SourceNamespaces are the source-cluster namespaces that the WatchRules of an
                        admitted GitTarget may read, in rules[].sourceNamespace: exact names,
                        "{consumer.namespace}" for the namespace named like the GitTarget's, or "*".
                        Omitted, this grant gives none.

                        The scope is the union over every grant admitting the GitTarget. It permits
                        and selects nothing: a namespace is read only when a WatchRule names it. A
                        rule with sourceNamespace "*" needs "*" in a grant, and is refused, not
                        narrowed, without it. A WatchRule with any rule outside the scope is refused
                        as a whole (SourceNamespaceNotAllowed) when it reconciles or a grant
                        changes. The credential's RBAC still applies inside the scope.
                      items:
                        description: |-
                          ScopeNamespace is a namespace in a grant's scope: a name,
                          "{consumer.namespace}" for the namespace named like the consumer's, or "*"
                          for every namespace.
                        maxLength: 63
                        type: string
                        x-kubernetes-validations:
                        - message: '''{consumer.name}'' is refused in a namespace
                            scope: the consumer picks its own name, so any namespace
                            could be reached by naming an object after it; use ''{consumer.namespace}'',
                            namespace names, or ''*'''
                          rule: self != '{consumer.name}'
                        - message: a namespace scope holds a namespace name, '{consumer.namespace}'
                            alone, or '*' alone
                          rule: self == '*' || self == '{consumer.namespace}' || self
                            == '{consumer.name}' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - consumerNamespaces
                  type: object
                  x-kubernetes-validations:
                  - message: a grant in allowedGitTargets sets sourceNamespaces, clusterResources,
                      or both; one that grants neither grants nothing
                    rule: has(self.sourceNamespaces) || has(self.clusterResources)
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              attribution:
                description: |-
                  Attribution configures how commit authors are found from this cluster's
                  audit events.
                properties:
                  auditRoute:
                    description: |-
                      AuditRoute is the route this cluster's audit events arrive on: the <route>
                      in the API server's audit webhook URL, /audit-webhook/<route>. When several
                      logical clusters share one webhook backend, it is instead the value of the
                      audit-event annotation that --author-attribution-audit-route-annotation-key
                      names. KubeProviders with the same route read the same cluster's
                      attribution facts.

                      Empty means <namespace>.<name>. Set it when several KubeProviders in this
                      namespace connect to one cluster, since an API server posts under one
                      route.

                      A route belongs to one namespace:

                      - the namespace the route starts with (<namespace>.), when a KubeProvider
                        there carries it;
                      - otherwise, the namespace of the oldest KubeProvider carrying it.

                      KubeProviders in another namespace that carry the route report
                      Stalled=True, reason AuditRouteConflict, and are not used.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                type: object
              client:
                description: |-
                  Client sets the request rate limits for this cluster. Omitted, they are 20
                  QPS with a burst of 30. Refused beside inCluster.
                properties:
                  burst:
                    description: |-
                      Burst is how many requests to this cluster may exceed qps at once. Defaults
                      to 30.
                    format: int32
                    minimum: 1
                    type: integer
                  qps:
                    description: |-
                      QPS is the sustained request rate to this cluster, in queries per second.
                      Defaults to 20.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              inCluster:
                description: |-
                  InCluster makes this KubeProvider use the operator's own identity in the
                  cluster it runs in. It is honored only for a KubeProvider the installation
                  lists in --in-cluster-kube-providers; any other reports Stalled=True, reason
                  InClusterNotAuthorized, and is never used. Set exactly one of secretRef and
                  inCluster. Immutable: delete and recreate the KubeProvider to change it.
                type: object
              secretRef:
                description: |-
                  SecretRef names the Secret, in this namespace, that holds a kubeconfig for
                  the cluster. With no key, the kubeconfig is read from "value", then
                  "value.yaml". A kubeconfig that uses exec auth, insecure-skip-tls-verify or
                  credentials named by file path is refused with Validated=False unless the
                  installation allows it. Set exactly one of secretRef and inCluster.
                  Immutable: delete and recreate the KubeProvider to change it.
                properties:
                  key:
                    description: Key in the Secret, when not specified an implementation-specific
                      default key is used.
                    type: string
                  name:
                    description: Name of the Secret.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.secretRef.name must not be empty
                  rule: size(self.name) > 0
            type: object
            x-kubernetes-validations:
            - message: set exactly one of spec.secretRef and spec.inCluster
              rule: has(self.secretRef) != has(self.inCluster)
            - message: 'spec.client is refused beside spec.inCluster: the operator''s
                own client is not throttled per provider'
              rule: '!has(self.inCluster) || !has(self.client)'
            - message: spec.secretRef and spec.inCluster are immutable; delete and
                recreate the KubeProvider to point it at a different cluster
              rule: has(self.inCluster) == has(oldSelf.inCluster) && (!has(self.secretRef)
                || self.secretRef == oldSelf.secretRef)
          status:
            description: status defines the observed state of KubeProvider.
            properties:
              auditRoute:
                description: |-
                  AuditRoute is the route in use: spec.attribution.auditRoute, or
                  <namespace>.<name> when that is empty. The AuditFactsReceived condition
                  describes this route, and starts over when it changes.
                type: string
              conditions:
                description: |-
                  Conditions are the latest observations of this KubeProvider's state. Ready,
                  Reconciling and Stalled follow kstatus; Stalled=True with reason
                  InClusterNotAuthorized or AuditRouteConflict means the KubeProvider is not
                  used at all. Validated says whether the credential is safe and readable,
                  checked without connecting.

                  AuditFactsReceived, which is not part of Ready, says whether an attribution
                  fact has ever arrived on status.auditRoute. It is True (Received) from the
                  first one on and never goes back. Until then it is Unknown, and the reason
                  says where to look: TransportUnavailable (the fact store refuses writes),
                  NoAuditDelivery (no audit events arrive at all), or RouteUnused (audit
                  events arrive, but never on this route). It is absent when author
                  attribution is off.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
