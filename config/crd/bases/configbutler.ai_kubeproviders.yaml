      type: string
    - jsonPath: .status.conditions[?(@.type=="Validated")].status
      name: Validated
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
