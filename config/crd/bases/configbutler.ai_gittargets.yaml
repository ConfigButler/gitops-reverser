---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: gittargets.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: GitTarget
    listKind: GitTargetList
    plural: gittargets
    singular: gittarget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.streams.summary
      name: Streams
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      priority: 1
      type: boolean
    - jsonPath: .status.placement.mode
      name: Layout
      priority: 1
      type: string
    - jsonPath: .status.placement.renderRoot
      name: RenderRoot
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="LayoutResolved")].reason
      name: LayoutResolved
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="GitPathAccepted")].status
      name: GitPathAccepted
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="RenderMatchesLive")].status
      name: RenderMatchesLive
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="ApplierClaimReady")].status
      name: ApplierClaimReady
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="StreamsRunning")].status
      name: StreamsRunning
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="SourceClusterReachable")].reason
      name: SourceReachable
      priority: 1
      type: string
    - jsonPath: .spec.encryption.provider
      name: Encryption
      priority: 1
      type: string
    - jsonPath: .spec.gitBranchRef.name
      name: GitBranch
      priority: 1
      type: string
    - jsonPath: .spec.path
      name: Path
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          GitTarget mirrors objects from a source cluster into one folder of a Git
          branch. Its WatchRules and ClusterWatchRules select the objects, its
          KubeProvider reads them, and its GitBranch writes them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GitTarget.
            properties:
              applierClaimRef:
                description: |-
                  ApplierClaimRef names the FluxClaim or ArgoCDClaim, in this namespace, that
                  holds the applier of this folder: the Flux Kustomization or Argo CD
                  Application that applies it. With it set, GitOps Reverser decides when that
                  applier runs, and runs it only after the edits it holds are published.
                  Objects another applier owns are not mirrored into the folder. The applier
                  must apply this GitTarget's repository and branch; the ApplierClaimReady
                  condition reports whether it does. Several GitTargets may name one applier
                  claim.
                properties:
                  kind:
                    description: 'Kind is the applier claim''s kind: "FluxClaim" or
                      "ArgoCDClaim".'
                    enum:
                    - FluxClaim
                    - ArgoCDClaim
                    type: string
                  name:
                    description: Name is the applier claim's name.
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              commit:
                description: |-
                  Commit configures how this GitTarget's writes are batched into commits and
                  how the commits are worded. Omitted, a commit window closes 5s after its
                  last write or 1m after it opened, and the built-in message templates are
                  used.
                properties:
                  message:
                    description: |-
                      Message sets the commit message templates. A template left empty uses the
                      built-in one.
                    properties:
                      liveTemplate:
                        description: |-
                          LiveTemplate is the Go template for the message of a commit made from
                          live edits, whatever its size. Omitted, a built-in template is used.

                          The template receives:

                          - Author: the username, which may be empty.
                          - GitTarget: the GitTarget's name.
                          - Count: the number of edits after coalescing, before comparing with Git.
                          - Operations: the number of edits per operation.
                          - Resources: one entry per resource in the commit.
                          - LabelValues "key": the distinct values of one label across Resources.
                          - LabelValue "key": the value of one label that every resource shares,
                            or empty when they differ.

                          Each resource has Operation, Group, Version, Resource, Kind, Namespace,
                          Name, APIVersion, ResourceVersion, Generation and Labels. Namespace is
                          "_cluster" for a cluster-scoped resource. Read one label with
                          {{.Label "key"}}; {{.Labels.key}} fails the commit for a resource without
                          that label. Kind and Labels are empty for a deletion, ResourceVersion
                          can be empty, and Generation is 0 for a kind without a spec, so guard
                          them with {{with}}.

                          A SaveRequest's message replaces this template without changing the
                          author; spec.commit.message.requestTemplate can wrap that message.
                        type: string
                      reconcileTemplate:
                        description: |-
                          ReconcileTemplate is the Go template for the message of a snapshot or resync
                          commit. Fields: Count, GitTarget, Group, Version, Resource, APIVersion,
                          Namespace and ResourceVersion (the list's, not one object's). The type and
                          namespace fields are empty for a snapshot of the whole folder, and
                          ResourceVersion can be empty, so guard them. A template naming Revision,
                          renamed to ResourceVersion, is rejected.
                        type: string
                      requestTemplate:
                        description: |-
                          RequestTemplate is the Go template that frames a SaveRequest's message. It
                          is used only for a commit whose SaveRequest supplied a message, and gets
                          liveTemplate's fields plus RequestMessage, the message as written; template
                          syntax inside the message stays literal. Omitted, the message is committed
                          as written. A template that never renders RequestMessage is rejected, and
                          one that fails at commit time commits the message as written.
                        type: string
                    type: object
                  unattributedWindows:
                    default: Keep
                    description: |-
                      UnattributedWindows says how much a SaveRequest on this GitTarget may
                      claim of a commit window whose writes name no author. It acts only while
                      the GitTarget's KubeProvider has never received an audit fact; on a
                      cluster that has, a write naming no author is never claimed. Defaults to
                      "Keep".

                      - "Keep": a request attaches only to its creator's own window.
                      - "SavedBy": a request that asks may give such a window its message. The
                        commit names no author, and its message ends with a Saved-By line
                        naming the request's creator.
                      - "TakeOver": a request that asks may also take such a window over. Its
                        creator authors the commit, and the message ends with an Author-Source
                        line.

                      Every write that names no author shares one window, whoever made it, so
                      a takeover names the creator as the author of all of them. Allow it only
                      where one person edits the mirrored namespaces at a time.
                    enum:
                    - Keep
                    - SavedBy
                    - TakeOver
                    type: string
                  window:
                    description: |-
                      Window sets when this GitTarget's commit windows close. A window opens on an
                      author's first write and collects that author's writes until idleTimeout
                      passes without one, or maxDuration after it opened, whichever comes first. A
                      change applies to windows opened afterward. A SaveRequest attached to a
                      window replaces both timers for that window.
                    properties:
                      idleTimeout:
                        default: 5s
                        description: |-
                          IdleTimeout closes the window this long after its last write, as a Go
                          duration ("5s", "750ms"). "0s" makes one commit per write. At most "24h".
                          Defaults to "5s".
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|μs|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: spec.commit.window.idleTimeout must be a Go duration
                            of at most 24h
                          rule: duration(self) <= duration('24h')
                      maxDuration:
                        default: 1m
                        description: |-
                          MaxDuration closes the window this long after it opened, however many writes
                          keep arriving, as a Go duration ("1m", "90s"). "0s" closes it right after
                          the write that opened it. At most "24h". Defaults to "1m".
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|μs|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: spec.commit.window.maxDuration must be a Go duration
                            of at most 24h
                          rule: duration(self) <= duration('24h')
                    type: object
                    x-kubernetes-validations:
                    - message: spec.commit.window.idleTimeout must not exceed maxDuration
                      rule: '!has(self.idleTimeout) || !has(self.maxDuration) || duration(self.idleTimeout)
                        <= duration(self.maxDuration)'
                type: object
              encryption:
                description: |-
                  Encryption configures how Secrets are encrypted before they are written to
                  Git.
                properties:
                  age:
                    description: Age configures age recipients for SOPS.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Enabled turns on age encryption: resolving recipients, and creating a key
                          when asked. Defaults to false.
                        type: boolean
                      recipients:
                        description: Recipients says where the age recipients come
                          from.
                        properties:
                          extractFromSecret:
                            default: false
                            description: |-
                              ExtractFromSecret adds the recipient of every *.agekey entry in
                              encryption.secretRef. Defaults to false.
                            type: boolean
                          generateWhenMissing:
                            default: false
                            description: |-
                              GenerateWhenMissing creates a date-named *.agekey entry in
                              encryption.secretRef when it has none. Defaults to false.
                            type: boolean
                          publicKeys:
                            description: PublicKeys is a fixed list of age recipients
                              ("age1...").
                            items:
                              minLength: 1
                              type: string
                            type: array
                        type: object
                    type: object
                  provider:
                    default: sops
                    description: |-
                      Provider is the encryption tool. Only "sops" is supported. Defaults to
                      "sops".
                    enum:
                    - sops
                    type: string
                  secretRef:
                    description: |-
                      SecretRef names the Secret, in this namespace, that holds the provider's
                      keys.
                    properties:
                      name:
                        description: Name of the referent.
                        type: string
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: encryption.secretRef.name must not be empty
                      rule: self.name != ''
                required:
                - provider
                type: object
              gitBranchRef:
                description: |-
                  GitBranchRef names the GitBranch this GitTarget writes to: the repository
                  branch and the credential that writes it. An omitted namespace means this
                  GitTarget's namespace. The GitBranch's spec.allowedGitTargets must admit
                  this namespace. Several GitTargets may share one GitBranch. Immutable:
                  delete and recreate the GitTarget to change it.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent, when not specified it
                      acts as LocalObjectReference.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.gitBranchRef.name must not be empty
                  rule: self.name != ''
              kubeProviderRef:
                description: |-
                  KubeProviderRef names the KubeProvider this GitTarget mirrors from: the
                  source cluster and the credential that reads it. An omitted namespace means
                  this GitTarget's namespace. The KubeProvider's spec.allowedGitTargets must
                  admit this namespace. Immutable: delete and recreate the GitTarget to change
                  it.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent, when not specified it
                      acts as LocalObjectReference.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.kubeProviderRef.name must not be empty
                  rule: self.name != ''
                - message: spec.kubeProviderRef is immutable; delete and recreate
                    the GitTarget to change the cluster it mirrors
                  rule: self == oldSelf
              onRefusal:
                default: Ignore
                description: |-
                  OnRefusal decides what happens when a live edit is refused because it has no
                  valid place in the folder. A refusal makes no commit, so the edit stays on
                  the cluster until something applies Git over it.

                  "Ignore" (the default) reports the refusal in conditions and events and does
                  nothing else.

                  "Reapply" asks the applier in spec.applierClaimRef, which it requires, to
                  apply the branch once the pending edits are published, which reverts the
                  refused edit. It fires only for an edit to a document the folder already
                  holds, in a write that removes no document, and never for a refusal of the
                  whole folder, such as unparseable YAML. A refusal that stands is reapplied
                  once, not on every recheck.
                enum:
                - Ignore
                - Reapply
                type: string
              path:
                description: |-
                  Path is the folder this GitTarget writes, relative to the repository root.
                  Use "." for the root itself. A leading "/" and ".." are rejected, and a
                  trailing "/" is dropped. Immutable: delete and recreate the GitTarget to
                  change it.
                minLength: 1
                type: string
              placement:
                description: |-
                  Placement decides where a new resource is written: one with no document
                  in the folder yet. A resource that already has a document is updated
                  where that document is. So a change here affects only resources created
                  afterward, and labeling a resource later never moves its file.

                  byType and default are path templates over the resource's identity:
                  {namespace}, {name}, {group}, {version}, {resource}, {kind} and more. They
                  may read a label: "{label:app.kubernetes.io/instance}/configmaps.yaml".

                  Two variables can be absent, and each then renders a built-in value:

                  - "{label:key}" renders "_unlabeled" for a resource without the label.
                  - "{namespace}" renders "_cluster" for a cluster-scoped resource.

                  Append "|fallback" to either to choose that value instead:
                  "{label:team|unassigned}", "{namespace|_global}". A fallback is up to 63
                  characters of [A-Za-z0-9._-], is not "." or "..", and may be empty to
                  drop the path segment. A {namespace} fallback that names a real namespace
                  files cluster-scoped resources in that namespace's folder. A fallback on
                  any other variable is rejected.
                properties:
                  byType:
                    additionalProperties:
                      type: string
                    description: |-
                      ByType maps a resource type, written "{group}/{version}/{resource}"
                      ("apps/v1/deployments", or "v1/configmaps" for the core group), to the path
                      template for new resources of that type. The template of a sensitive type,
                      such as Secrets, must contain the resource's whole identity, so two of them
                      never share a file.
                    type: object
                  default:
                    description: |-
                      Default is the path template for a new resource whose type has no byType
                      entry. Omitted, a new document goes next to the folder's kustomization when
                      exactly one governs the folder, and otherwise to
                      {namespace}/{group}/{resource}/{name}.yaml. That path has no version, so add
                      {version} to a template to keep two versions of one resource apart. A
                      bundling template such as "all.yaml" is valid only when every sensitive type
                      has its own byType entry.
                    type: string
                  useKustomize:
                    description: |-
                      UseKustomize makes GitOps Reverser create a kustomization.yaml at spec.path
                      when no kustomization governs the folder yet. The first new document creates
                      it, listing every managed document already in the folder and the new one,
                      and nothing else: no namespace:. It has no effect on a folder that already
                      has a kustomization. A new file is always added to the kustomization
                      governing it, and a template that places a document outside that
                      kustomization is refused. Defaults to false.
                    type: boolean
                type: object
              prune:
                description: |-
                  Prune decides which deletions remove documents from this folder: a delete
                  observed on the source cluster, and a document a resync finds no resource
                  for. Omitted, mode is "OnEvent": observed deletes are mirrored, and a resync
                  removes nothing.
                properties:
                  mode:
                    default: OnEvent
                    description: |-
                      Mode decides which deletions are mirrored. Defaults to "OnEvent".

                      - "OnEvent": mirrors a delete observed on the source cluster; a resync
                        removes nothing.
                      - "Never": removes nothing.
                      - "Always": as "OnEvent", and a resync also removes a document that has
                        no resource on the cluster.
                    enum:
                    - Never
                    - OnEvent
                    - Always
                    type: string
                type: object
              serializeNamespace:
                description: |-
                  SerializeNamespace decides whether a namespaced resource's document
                  carries metadata.namespace. It applies to every write, not just the
                  first, and is ignored for cluster-scoped resources.

                  - Omitted: decided per document. The namespace is left out only when the
                    kustomization governing the document's path sets namespace: to that
                    same namespace. This suits a folder of nested kustomize roots that each
                    set their own namespace.
                  - true: always written. Use it for a flat folder applied as is.
                  - false: never written, for a folder whose namespace something else
                    supplies: a Flux Kustomization's targetNamespace, an Argo CD
                    Application's destination.namespace, or a kustomization.

                  With false, the folder holds one source namespace. A WatchRule bringing a
                  second one is refused with GitPathAccepted=False, reason
                  MultipleSourceNamespaces.
                type: boolean
              suspend:
                description: |-
                  Suspend stops this GitTarget from making new commits, without deleting
                  it. Defaults to false.

                  While it is set, watches keep running and status.placement stays current,
                  but status.retention is not published.

                  A commit already made locally is still pushed, so one more commit can
                  appear seconds after it is set: suspend stops the next write and does not
                  undo the last one.

                  Clearing it resumes from the current cluster state at the next resync.
                  Writes skipped while suspended are not replayed.
                type: boolean
            required:
            - gitBranchRef
            - kubeProviderRef
            - path
            type: object
            x-kubernetes-validations:
            - message: spec.gitBranchRef is immutable; delete and recreate the GitTarget
                to change its destination
              rule: self.gitBranchRef == oldSelf.gitBranchRef
            - message: spec.path is immutable; delete and recreate the GitTarget to
                change its destination
              rule: self.path == oldSelf.path
            - message: 'spec.onRefusal: Reapply needs spec.applierClaimRef, the applier
                claim asked to reapply'
              rule: '!has(self.onRefusal) || self.onRefusal != ''Reapply'' || has(self.applierClaimRef)'
          status:
            description: status defines the observed state of GitTarget.
            properties:
              conditions:
                description: |-
                  Conditions are the latest observations of this GitTarget's state. Ready,
                  Reconciling and Stalled follow kstatus; the others say which check holds the
                  GitTarget back.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              placement:
                description: |-
                  Placement is this folder's layout as the last scan resolved it: whether a
                  kustomization governs new documents, which one, and which bases the folder
                  renders but may not write. The LayoutResolved condition gives the verdict.
                properties:
                  mode:
                    description: |-
                      Mode is how this folder is written.

                      "Plain": no kustomization governs the folder. Documents are written and
                      removed, and nothing else is touched.

                      "KustomizeRoot": one kustomization governs the folder and renders nothing
                      outside it. A new document is also added to its resources:, a removed one is
                      dropped from it, and every write is checked by rendering, so kustomize can
                      refuse one.

                      "KustomizeOverlay": as KustomizeRoot, and the folder also renders a base
                      outside it (readOnlyBases). An edit to a field the base sets is written into
                      the overlay where it can be (images:, replicas:) and refused with
                      WriteBoundaryRefused otherwise. Deleting an object the base supplies writes
                      a $patch: delete into the overlay.

                      Empty when the folder holds more than one kustomize root
                      (LayoutResolved=Ambiguous): no new document is placed until spec.path points
                      at one of them.
                    enum:
                    - Plain
                    - KustomizeRoot
                    - KustomizeOverlay
                    type: string
                  readOnlyBases:
                    description: |-
                      ReadOnlyBases are the kustomization directories this folder renders but may
                      not write, relative to spec.path, so they start with "../". Set only for
                      KustomizeOverlay. An edit to a document under one of them is refused with
                      WriteBoundaryRefused unless the overlay can express it.
                    items:
                      type: string
                    type: array
                  renderRoot:
                    description: |-
                      RenderRoot is the kustomization directory that governs new documents,
                      relative to spec.path ("." is the folder itself). Empty for Plain, and when
                      the layout is Ambiguous.
                    type: string
                  resolvedAt:
                    description: |-
                      ResolvedAt is when this layout was first seen. Like resolvedAtCommit, it
                      does not move while the layout stays the same.
                    format: date-time
                    type: string
                  resolvedAtCommit:
                    description: |-
                      ResolvedAtCommit is the commit at which this layout was first seen. It does
                      not move while the layout stays the same, so a commit older than the branch
                      head means the layout has not changed since. Empty until the branch has a
                      commit.
                    type: string
                type: object
              retention:
                description: |-
                  Retention counts the documents a resync kept because spec.prune.mode did not
                  allow removing them. A delete observed on the cluster and not mirrored under
                  "Never" is not counted, so a "Never" folder can report zero. It is
                  information only and changes no condition.
                properties:
                  lastChangedAt:
                    description: |-
                      LastChangedAt is when the count or the mode last changed. A resync that
                      reports the same count leaves it alone, so it does not say when retention
                      was last measured.
                    format: date-time
                    type: string
                  mode:
                    description: |-
                      Mode is the spec.prune.mode these counts were taken under, with the default
                      applied.
                    enum:
                    - Never
                    - OnEvent
                    - Always
                    type: string
                  retainedDocuments:
                    description: |-
                      RetainedDocuments is how many documents the prune policy kept that have no
                      resource on the cluster. Zero means a resync found nothing to keep. An
                      absent retention block means no resync has reported yet.
                    format: int32
                    type: integer
                required:
                - retainedDocuments
                type: object
              streams:
                description: Streams counts the types this GitTarget watches, by watch
                  state.
                properties:
                  blocked:
                    description: Blocked is how many of them cannot be watched right
                      now.
                    format: int32
                    type: integer
                  pendingSample:
                    description: PendingSample names up to five types that are not
                      ready yet.
                    items:
                      type: string
                    maxItems: 5
                    type: array
                  ready:
                    description: Ready is how many of them are streaming events.
                    format: int32
                    type: integer
                  replaying:
                    description: Replaying is how many of them are still receiving
                      their initial list.
                    format: int32
                    type: integer
                  summary:
                    description: |-
                      Summary is ready/total for display, such as "3/4". Read ready and total
                      instead of parsing it.
                    type: string
                  total:
                    description: Total is how many types are watched.
                    format: int32
                    type: integer
                required:
                - blocked
                - ready
                - replaying
                - total
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
