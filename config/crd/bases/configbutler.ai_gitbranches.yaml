---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: gitbranches.configbutler.ai
spec:
  group: configbutler.ai
  names:
    kind: GitBranch
    listKind: GitBranchList
    plural: gitbranches
    singular: gitbranch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gitProviderRef.name
      name: Provider
      type: string
    - jsonPath: .spec.gitProviderRef.namespace
      name: ProviderNamespace
      type: string
    - jsonPath: .spec.branch
      name: Branch
      type: string
    - jsonPath: .status.remote.commit
      name: Commit
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .status.repository
      name: Repository
      priority: 1
      type: string
    - jsonPath: .status.gitTargetCount
      name: Targets
      priority: 1
      type: integer
    - jsonPath: .status.remote.lastVerifiedAt
      name: Verified
      priority: 1
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          GitBranch is one branch of a Git repository, written through a GitProvider's credential. It holds
          the branch for every GitTarget that references it: one branch worker, one credential, one
          checkout. Only one GitBranch may hold a repository branch at a time.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GitBranch
            properties:
              allowedGitTargets:
                description: |-
                  AllowedGitTargets says which GitTargets may write through this GitBranch. Nothing is admitted
                  automatically, this GitBranch's own namespace included: a GitTarget there needs a grant too,
                  such as from: Same. Omitted or empty, no GitTarget writes through it. Grants combine by union.
                  Mutable: claiming a branch includes the right to share it.
                items:
                  description: |-
                    NamespaceGrant admits the objects in some control-cluster namespaces, for the act the list holding
                    it names.
                  properties:
                    from:
                      description: |-
                        From is where this grant admits from: Same (the namespace of the object holding the grant),
                        Names (the namespaces in names), Selector (the namespaces whose labels match selector) or All
                        (every namespace).
                      enum:
                      - Same
                      - Names
                      - Selector
                      - All
                      type: string
                    names:
                      description: 'Names are the control-cluster namespaces admitted
                        with from: Names, by exact name.'
                      items:
                        description: GrantNamespace is one control-cluster namespace
                          a grant admits by name.
                        maxLength: 63
                        type: string
                        x-kubernetes-validations:
                        - message: 'names: a variable is refused, because names are
                            matched against the consumer''s namespace and ''{consumer.namespace}''
                            would admit every consumer; use from: All to admit every
                            namespace, or from: Same for the namespace of the object
                            holding the grant'
                          rule: self != '{consumer.namespace}' && self != '{consumer.name}'
                        - message: 'names: ''*'' is refused; use from: All to admit
                            every namespace'
                          rule: self != '*'
                        - message: names holds namespace names (DNS labels)
                          rule: self == '{consumer.namespace}' || self == '{consumer.name}'
                            || self == '*' || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: set
                    selector:
                      description: |-
                        Selector matches labels on control-cluster Namespaces, with from: Selector. It must select
                        something: to admit every namespace, use from: All.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - from
                  type: object
                  x-kubernetes-validations:
                  - message: 'from: Names needs names'
                    rule: self.from != 'Names' || has(self.names)
                  - message: 'names goes only with from: Names'
                    rule: '!has(self.names) || self.from == ''Names'''
                  - message: 'from: Selector needs a selector; to admit every namespace,
                      use from: All'
                    rule: self.from != 'Selector' || has(self.selector)
                  - message: 'selector goes only with from: Selector'
                    rule: '!has(self.selector) || self.from == ''Selector'''
                  - message: 'selector: {} is refused; to admit every namespace, use
                      from: All'
                    rule: '!has(self.selector) || (has(self.selector.matchLabels)
                      && size(self.selector.matchLabels) > 0) || (has(self.selector.matchExpressions)
                      && size(self.selector.matchExpressions) > 0)'
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              branch:
                description: |-
                  Branch is the branch on the remote that this GitBranch writes. It must match one of the
                  patterns the GitProvider's spec.allowedGitBranches give this GitBranch's namespace. Only one
                  GitBranch writes a repository branch: the oldest admitted one
                  whose credential proves it can open a push session holds it, and any other GitBranch for the
                  same repository and branch reports Stalled with reason BranchConflict.
                  Immutable: delete and recreate the GitBranch to change it.
                minLength: 1
                type: string
              gitProviderRef:
                description: |-
                  GitProviderRef names the GitProvider whose repository and credential this branch is written
                  with. Namespace omitted means this GitBranch's own namespace. The GitBranch claims its branch
                  only while that GitProvider's spec.allowedGitBranches admits this namespace and the branch.
                  Immutable: delete and recreate the GitBranch to change it.
                properties:
                  name:
                    description: Name of the referent.
                    type: string
                  namespace:
                    description: Namespace of the referent, when not specified it
                      acts as LocalObjectReference.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.gitProviderRef.name must not be empty
                  rule: self.name != ''
              parentBranch:
                description: |-
                  ParentBranch is the branch spec.branch is created from, and the branch compared against while
                  spec.branch does not exist on the remote. Omitted: the branch the remote's HEAD points at (its
                  default branch), or a branch with no history when the repository is empty. When set, it must
                  exist on the remote for spec.branch to be created; otherwise this GitBranch reports
                  ParentBranchNotFound and nothing is written. Once spec.branch exists, it is used as it is and
                  the parent is not followed. It is only read, so the GitProvider's spec.allowedGitBranches need
                  not allow it.
                  Immutable, including adding or removing it: delete and recreate the GitBranch to change it.
                minLength: 1
                type: string
            required:
            - branch
            - gitProviderRef
            type: object
            x-kubernetes-validations:
            - message: spec.gitProviderRef is immutable; delete and recreate the GitBranch
                to change it
              rule: self.gitProviderRef == oldSelf.gitProviderRef
            - message: spec.branch is immutable; delete and recreate the GitBranch
                to change it
              rule: self.branch == oldSelf.branch
            - message: spec.parentBranch is immutable; delete and recreate the GitBranch
                to change it
              rule: has(self.parentBranch) == has(oldSelf.parentBranch) && (!has(self.parentBranch)
                || self.parentBranch == oldSelf.parentBranch)
          status:
            description: status defines the observed state of GitBranch
            properties:
              conditions:
                description: |-
                  Conditions report whether this GitBranch holds its repository branch and can write it: the
                  Ready summary plus the kstatus Reconciling/Stalled pair.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gitTargetCount:
                description: |-
                  GitTargetCount is how many GitTargets reference this GitBranch, from any namespace. More than
                  one means they share its branch worker; each reports its own folder's health on its own
                  conditions.
                format: int32
                type: integer
              lastPushNoticeAt:
                description: |-
                  LastPushNoticeAt is when a GitReceiver last delivered a push to this branch, which made the
                  branch worker look at once instead of at its next refresh. It records receipt only: whether
                  that look reached the remote is status.remote's to say. Absent means no delivery has reached
                  this branch: no GitReceiver is set up, the Git host's webhook does not reach one, the delivery
                  names the repository by a URL other than the GitProvider's spec.url, or no branch worker writes
                  the branch because no GitTarget references this GitBranch. It advances at most once a minute,
                  and is cleared when the GitProvider is recreated for another repository.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest generation observed
                  by the controller.
                format: int64
                type: integer
              remote:
                description: |-
                  Remote is where this branch is on the Git remote, and when that was last proved. It is
                  renewed by every confirmed look: a successful push as well as a fetch. Absent means nothing
                  has proved anything yet: nothing has looked, or the GitProvider was recreated against a
                  different repository and what was published no longer describes the one it names.
                properties:
                  commit:
                    description: |-
                      Commit is the commit hash the branch is at on the remote. EMPTY means the branch is not on
                      the remote at all, which is not an error: a branch does not exist without a commit, and a
                      branch nothing has written to has nothing there yet.
                    type: string
                  lastVerifiedAt:
                    description: LastVerifiedAt is when the remote was last observed.
                    format: date-time
                    type: string
                  parent:
                    description: |-
                      Parent is what the branch would be created from, observed with it: present only while the
                      remote does not carry the branch. Once the branch exists its parent is not followed, so this
                      is omitted.
                    properties:
                      branch:
                        description: |-
                          Branch is the parent branch: spec.parentBranch, or the branch the remote's HEAD names when
                          that is omitted. Empty when State is Unborn, and when the remote names no default branch.
                        type: string
                      commit:
                        description: |-
                          Commit is the commit hash the parent branch is at on the remote: the commit the branch's
                          first commit would build on. Set only when State is Found.
                        type: string
                      state:
                        description: |-
                          State is what the branch would be created from: Found (the parent's tip), Missing (the parent
                          is not on the remote; nothing is written) or Unborn (an empty repository, with no refs at
                          all, and no parent configured; the first commit has no history).
                        enum:
                        - Found
                        - Missing
                        - Unborn
                        type: string
                    required:
                    - state
                    type: object
                  verifiedBy:
                    description: |-
                      VerifiedBy is what proved it: `Push` means the server accepted a ref update of ours, so
                      this commit is our own work; `Fetch` means we went and looked, and this is what was
                      there. A `Fetch` next to a commit no publication of yours produced is how a foreign push
                      to the branch is read off kubectl.
                    enum:
                    - Push
                    - Fetch
                    type: string
                type: object
              repository:
                description: |-
                  Repository is the GitProvider's repository URL, normalized: host and path, with no scheme,
                  user or ".git" suffix. Together with spec.branch it is the key only one GitBranch may hold, so
                  two GitProviders spelling one repository differently still conflict.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
