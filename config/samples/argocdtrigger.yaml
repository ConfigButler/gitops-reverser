# An ArgoCDTrigger holds the Argo CD Application, with automated sync off, that syncs
# example-target's folder. Name it from the GitTarget with
# spec.applyTriggerRef: {kind: ArgoCDTrigger, name: example-trigger}. See docs/bi-directional-argocd.md.
apiVersion: configbutler.ai/v1alpha3
kind: ArgoCDTrigger
metadata:
  name: example-trigger
  namespace: default
spec:
  # The cluster the Application is in: here the chart's `local` KubeProvider, the operator's own.
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  # In another namespace than the trigger's, so the KubeProvider must set
  # allowCrossNamespace.appliers: true, or the trigger reports ApplierNamespaceNotAllowed.
  applicationRef:
    namespace: argocd
    name: example-apps
