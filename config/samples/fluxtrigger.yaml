# A FluxTrigger holds the Flux Kustomization that applies example-target's folder. Name it from the
# GitTarget with spec.applyTriggerRef: {kind: FluxTrigger, name: example-trigger}. See
# docs/bi-directional-flux.md.
apiVersion: configbutler.ai/v1alpha3
kind: FluxTrigger
metadata:
  name: example-trigger
  namespace: default
spec:
  # The cluster the Kustomization is in: here the chart's `local` KubeProvider, the operator's own.
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  # In another namespace than the trigger's, so the KubeProvider must set
  # allowCrossNamespace.appliers: true, or the trigger reports ApplierNamespaceNotAllowed.
  kustomizationRef:
    namespace: flux-system
    name: example-apps
