apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: example-target
  namespace: default
spec:
  providerRef:
    name: example-provider
  branch: main
  # Required relative repository path. Use "." only to deliberately write at repo root.
  path: live-cluster
  # How this folder's writes become commits. Omitted, events coalesce over a 5s
  # rolling silence window and the built-in message templates are used.
  commit:
    window: "5s"
    # message:
    #   eventTemplate: "audit: [{{.Operation}}] {{.APIVersion}}/{{.Resource}}/{{.Name}}"
    #   reconcileTemplate: "reconciled {{.Count}} {{.Resource}}"
  encryption:
    provider: sops
    age:
      enabled: true
      recipients:
        extractFromSecret: true
        generateWhenMissing: true
    secretRef:
      name: sops-age-key
