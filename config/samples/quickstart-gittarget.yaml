apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: example-target
  namespace: default
spec:
  gitProviderRef:
    name: example-provider
  branch: main
  # Required relative repository path. Use "." only to deliberately write at repo root.
  path: live-cluster
  # How this folder's writes become commits. A commit window closes after
  # idleTimeout of silence, or maxDuration after it opened. Omitted, it is
  # {idleTimeout: 5s, maxDuration: 1m} and the built-in message templates are used.
  commit:
    window:
      idleTimeout: "5s"
      maxDuration: "1m"
    # message:
    #   liveTemplate: "audit: {{range .Resources}}[{{.Operation}}] {{.APIVersion}}/{{.Resource}}/{{.Name}}{{end}}"
    #   reconcileTemplate: "chore: reconcile {{.Count}} {{.Resource}}"
  encryption:
    provider: sops
    age:
      enabled: true
      recipients:
        extractFromSecret: true
        generateWhenMissing: true
    secretRef:
      name: sops-age-key
