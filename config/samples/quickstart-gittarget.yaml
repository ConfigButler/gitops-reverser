apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: example-target
  namespace: default
spec:
  # The GitBranch this folder is written to. Add `namespace:` to use one from another namespace,
  # whose spec.allowedGitTargets has to admit this one.
  gitBranchRef:
    name: example-branch
  # The KubeProvider this folder mirrors from: the chart's `local` provider in its release
  # namespace, whose spec.allowedGitTargets must admit this namespace (the chart's quickstart values
  # do). Omit `namespace:` for one in this GitTarget's own namespace. Immutable.
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  # Required relative repository path. Use "." only to deliberately write at repo root.
  path: live-cluster
  # How this folder's writes become commits. A commit window closes after
  # idleTimeout of silence, or maxDuration after it opened. Omitted, it is
  # {idleTimeout: 5s, maxDuration: 1m} and the built-in message templates are used.
  commit:
    window:
      idleTimeout: "5s"
      maxDuration: "1m"
    # message:
    #   liveTemplate: "audit: {{range .Resources}}[{{.Operation}}] {{.APIVersion}}/{{.Resource}}/{{.Name}}{{end}}"
    #   reconcileTemplate: "chore: reconcile {{.Count}} {{.Resource}}"
  encryption:
    provider: sops
    age:
      enabled: true
      recipients:
        extractFromSecret: true
        generateWhenMissing: true
    secretRef:
      name: sops-age-key
