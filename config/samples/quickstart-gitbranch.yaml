apiVersion: configbutler.ai/v1alpha3
kind: GitBranch
metadata:
  name: example-branch
  namespace: default
spec:
  # A GitProvider in this GitBranch's namespace. Its credential has to be able to open a push
  # session on the repository, or this GitBranch never holds the branch.
  gitProviderRef:
    name: example-provider
  # Must match one of the GitProvider's allowedBranches. Only one GitBranch writes a repository branch.
  branch: main
  # Optional: the branch `main` is created from while the remote does not have it.
  # parentBranch: develop
