# A remote source cluster, as a namespaced KubeProvider. Its kubeconfig Secret lives in this
# provider's own namespace, never on the source cluster. secretRef is immutable: delete and
# recreate the provider to point it at another cluster. key is optional; empty reads "value",
# then "value.yaml".
#
# Its audit route defaults to <namespace>.<name> (default.prod-eu-1), so the source cluster's API
# server posts audit events to /audit-webhook/default.prod-eu-1.
#
# For the operator's own cluster, set `inCluster: {}` instead of secretRef. That is honored only for
# a provider the installation lists in --in-cluster-kube-providers; the chart renders one, `local`
# in its release namespace, and lists it.
apiVersion: configbutler.ai/v1alpha3
kind: KubeProvider
metadata:
  name: prod-eu-1
  namespace: default
spec:
  secretRef:
    name: prod-eu-1-kubeconfig
  # Omitted, each list is one grant for this provider's own namespace; a list you write is the whole
  # policy, and [] admits nobody. Each grant says where it
  # admits from (Same, Names, Selector or All) and what: the source namespaces a GitTarget's
  # WatchRules may watch ("{consumer.namespace}" is the GitTarget's own; "*" is every namespace,
  # which `sourceNamespace: "*"` needs), and the cluster-scoped resources a ClusterWatchRule may mirror.
  # Here: every namespace labelled tier=trusted in the control cluster mirrors its own namespace,
  # and this namespace mirrors every namespace and the CRDs.
  allowedGitTargets:
    - consumerNamespaces:
        from: Selector
        selector:
          matchLabels:
            tier: trusted
      sourceNamespaces: ["{consumer.namespace}"]
    - consumerNamespaces: {from: Same}
      sourceNamespaces: ["*"]
      clusterResources: [customresourcedefinitions.apiextensions.k8s.io]
  # Which applier claims may hold a Flux Kustomization or an Argo CD Application through this
  # provider, and where it may live. Admission to mirror is no admission to apply.
  allowedApplierClaims:
    - consumerNamespaces: {from: Same}
      applierNamespaces: ["{consumer.namespace}"]
