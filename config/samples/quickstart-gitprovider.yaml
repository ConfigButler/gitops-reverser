apiVersion: configbutler.ai/v1alpha3
kind: GitProvider
metadata:
  name: example-provider
  namespace: default
spec:
  # Replace with your own repository URL
  url: "git@github.com:YOUR_USERNAME/my-k8s-audit.git"
  allowedBranches: ["*"]
  secretRef:
    name: git-creds

  # The connection's identity. How writes are batched and phrased belongs to the
  # GitTarget instead: spec.commit.window and spec.commit.message.
  # commit:
  #   committer:
  #     name: "GitOps Reverser"
  #     email: "noreply@configbutler.ai"
