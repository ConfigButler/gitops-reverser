---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-reverser
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - update
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiregistration.k8s.io
  resources:
  - apiservices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - configbutler.ai
  resources:
  - argocdclaims
  - fluxclaims
  - gitbranches
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - configbutler.ai
  resources:
  - argocdclaims/finalizers
  - fluxclaims/finalizers
  - gitbranches/finalizers
  - gitproviders/finalizers
  verbs:
  - update
- apiGroups:
  - configbutler.ai
  resources:
  - argocdclaims/status
  - clusterwatchrules/status
  - fluxclaims/status
  - gitbranches/status
  - gitproviders/status
  - gitreceivers/status
  - gittargets/status
  - kubeproviders/status
  - saverequests/status
  - watchrules/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - configbutler.ai
  resources:
  - clusterwatchrules
  - gitproviders
  - gittargets
  - watchrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - configbutler.ai
  resources:
  - gitreceivers
  - kubeproviders
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - configbutler.ai
  resources:
  - saverequests
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - source.configbutler.ai
  resources:
  - remotesaverequests
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - source.configbutler.ai
  resources:
  - remotesaverequests/status
  verbs:
  - get
  - update
