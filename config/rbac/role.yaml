---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitops-reverser
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - update
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiregistration.k8s.io
  resources:
  - apiservices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - configbutler.ai
  resources:
  - argocdtriggers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - configbutler.ai
  resources:
  - argocdtriggers/status
  - clusterproviders/status
  - clusterwatchrules/status
  - commitrequests/status
  - fluxtriggers/status
  - gitbranches/status
  - gitproviders/status
  - gittargets/status
  - watchrules/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - configbutler.ai
  resources:
  - clusterproviders
  - fluxtriggers
  - gitbranches
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - configbutler.ai
  resources:
  - clusterwatchrules
  - gitproviders
  - gittargets
  - watchrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - configbutler.ai
  resources:
  - commitrequests
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - configbutler.ai
  resources:
  - fluxtriggers/finalizers
  - gitbranches/finalizers
  - gitproviders/finalizers
  verbs:
  - update
