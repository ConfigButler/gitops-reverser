# What GitOps Reverser needs to drive a Flux Kustomization a FluxClaim holds: read the
# Kustomization and the GitRepository it applies from, suspend and resume the Kustomization and
# stamp reconcile.fluxcd.io/requestedAt on either, list the consumers of the GitRepository
# (Kustomizations, and HelmReleases with the HelmCharts built from it; without it the applier claim lists
# none in status.source.otherConsumers), and check that it may.
#
# It is kept OUT of role.yaml because no GitTarget needs it until one names an applier, and an
# install that does not use Flux should not hold patch rights on Flux objects. Drop this pair when
# no FluxClaim exists (Helm: `applierAccess.flux: false`, the default there). For a
# remote source cluster, grant the same to the identity of the ClusterProvider's kubeconfig there.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gitops-reverser
  name: gitops-reverser-flux-applier
rules:
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - get
      - list
      - patch
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - list
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - gitrepositories
    verbs:
      - get
      - patch
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - helmcharts
    verbs:
      - list
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectaccessreviews
    verbs:
      - create
