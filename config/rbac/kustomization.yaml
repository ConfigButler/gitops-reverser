apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sa.yaml
  - role.yaml
  # The wildcard read a WatchRule may need, kept out of role.yaml so it can be dropped whole.
  # See docs/rbac.md; the Helm chart renders the same pair from `rbac.watchTypes`.
  - watch-any-role.yaml
  - watch-any-rolebinding.yaml
  # Patch rights on Flux Kustomizations and GitRepositories, for GitTarget.spec.applier. See the file.
  - flux-applier-role.yaml
  - flux-applier-rolebinding.yaml
  # Update rights on Argo CD Applications, for GitTarget.spec.applier.applicationRef. See the file.
  - argocd-applier-role.yaml
  - argocd-applier-rolebinding.yaml
  - cluster-role-jane-aggregated.yaml
  - cluster-rolebinding.yaml
  - cluster-rolebinding-jane.yaml   # E2E-only helper: allows impersonated user jane@acme.com writes in tests.
  - cluster-rolebinding-jane-aggregated.yaml
