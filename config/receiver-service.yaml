# The push receiver: plain HTTP for Git hosts' push webhooks (--receiver-bind-address in
# deployment.yaml). A delivery is POST <GitProvider status.webhookPath>.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gitops-reverser
  name: gitops-reverser-receiver
  namespace: sut
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: receiver
  selector:
    app.kubernetes.io/name: gitops-reverser
    control-plane: gitops-reverser
