apiVersion: configbutler.ai/v1alpha3
kind: GitProvider
metadata:
  name: demo
spec:
  url: http://gitea-http.gitea-e2e.svc.cluster.local:13000/testorg/demo.git
  allowedBranches:
    - main
    - nl-stuff
  secretRef:
    name: git-creds-demo
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: demo-podinfos
spec:
  gitProviderRef:
    name: demo
  branch: nl-stuff
  path: podinfos
  commit:
    window: "5s"
---
apiVersion: configbutler.ai/v1alpha3
kind: WatchRule
metadata:
  name: demo-podinfos
spec:
  gitTargetRef:
    name: demo-podinfos
  rules:
    - operations: [CREATE, UPDATE, DELETE]
      apiGroups: ["kro.run"]
      apiVersions: ["v1alpha1"]
      resources: ["podinfoapps"]
