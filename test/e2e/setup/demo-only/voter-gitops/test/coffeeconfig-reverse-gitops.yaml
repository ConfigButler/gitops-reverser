apiVersion: configbutler.ai/v1alpha3
kind: GitProvider
metadata:
  name: demo-coffeeconfig
spec:
  url: http://gitea-http.gitea-e2e.svc.cluster.local:13000/testorg/demo.git
  allowedGitBranches:
    - from: Same
      branches: [main, demo-test]
  secretRef:
    name: git-creds-demo
---
apiVersion: configbutler.ai/v1alpha3
kind: GitBranch
metadata:
  name: demo-coffeeconfig-demo-test
spec:
  gitProviderRef:
    name: demo-coffeeconfig
  branch: demo-test
  allowedGitTargets:
    - from: Same
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: demo-coffeeconfig
spec:
  gitBranchRef:
    name: demo-coffeeconfig-demo-test
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  path: voter-coffee
  commit:
    window:
      idleTimeout: "0s"
---
apiVersion: configbutler.ai/v1alpha3
kind: WatchRule
metadata:
  name: demo-coffeeconfig
spec:
  gitTargetRef:
    name: demo-coffeeconfig
  rules:
    - apiGroups: ["examples.configbutler.ai"]
      apiVersions: ["v1alpha1"]
      resources: ["coffeeconfigs"]
