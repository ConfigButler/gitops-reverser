apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The wardle sample aggregated API server. The e2e setup and the mutation-capture lab
# (test/mutationlab/Taskfile-lab.yml) both apply this directory, so the two clusters
# serve the same aggregated API.
resources:
  - namespace.yaml
  - sa.yaml
  - deployment.yaml
  - service.yaml
  - apiservice.yaml
  - auth-delegator.yaml
  - auth-reader.yaml
  - rbac.yaml
  - rbac-bind.yaml
