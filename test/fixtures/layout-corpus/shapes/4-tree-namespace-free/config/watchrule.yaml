apiVersion: configbutler.ai/v1alpha3
kind: WatchRule
metadata:
  name: checkout-content
  namespace: shop
spec:
  targetRef:
    name: checkout-artifact
  rules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["configmaps"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments"]
