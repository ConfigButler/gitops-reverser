apiVersion: configbutler.ai/v1alpha3
kind: GitBranch
metadata:
  name: artifacts-repository-main
  namespace: shop
spec:
  gitProviderRef:
    name: artifacts-repository
  branch: main
  allowedGitTargets:
    - consumerNamespaces: {from: Same}
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: checkout-artifact
  namespace: shop
spec:
  gitBranchRef:
    name: artifacts-repository-main
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  path: apps/checkout
  # A tree WITHOUT {namespace}: the subfolders group by type, not by namespace,
  # so the folder stays single-namespace. That is the precondition for the flag
  # below; see the README for what a MULTI-namespace tree does to it.
  placement:
    default: "{resource}/{name}.yaml"
  serializeNamespace: false
