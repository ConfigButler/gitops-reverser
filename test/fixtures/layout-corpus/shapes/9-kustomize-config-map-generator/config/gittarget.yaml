apiVersion: configbutler.ai/v1alpha3
kind: GitBranch
metadata:
  name: app-repository-main
  namespace: coffee
spec:
  gitProviderRef:
    name: app-repository
  branch: main
  allowedGitTargets:
    - consumerNamespaces: {from: Same}
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: coffee
  namespace: coffee
spec:
  gitBranchRef:
    name: app-repository-main
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  path: apps/coffee
  # Nothing is declared: a configMapGenerator with the name hash disabled is
  # adopted as it is, and its input files are where a ConfigMap edit lands.
