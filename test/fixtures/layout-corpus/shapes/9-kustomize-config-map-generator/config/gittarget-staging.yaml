apiVersion: configbutler.ai/v1alpha3
kind: GitBranch
metadata:
  name: app-repository-main
  namespace: shop-staging
spec:
  gitProviderRef:
    name: app-repository
  branch: main
  allowedGitTargets:
    - consumerNamespaces: {from: Same}
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: shop
  namespace: shop-staging
spec:
  gitBranchRef:
    name: app-repository-main
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  path: apps/shop/overlays/staging
  # The overlay merges into the base's generator with behavior: merge.
