apiVersion: configbutler.ai/v1alpha3
kind: GitBranch
metadata:
  name: app-repository-main
  namespace: coffee
spec:
  gitProviderRef:
    name: app-repository
  branch: main
  allowedGitTargets:
    - consumerNamespaces: {from: Same}
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: hashed-menu
  namespace: coffee
spec:
  gitBranchRef:
    name: app-repository-main
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  path: apps/hashed
  # The same generator with the name hash left on, which is refused.
