apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: prod-mirror
  namespace: homelab-config
spec:
  providerRef:
    name: mirror-repository
  clusterProviderRef:
    name: prod
  branch: main
  path: mirror/prod
  # The WatchRule beside this file names source namespaces other than its own. The
  # ClusterProvider's allowAnySourceNamespace is the only grant that needs, and the
  # source credential's RBAC bounds what it can actually read.
  # Flat is a DECLARED shape. Without a template the built-in ladder ends at the
  # canonical identity path, which is a tree. One file per object, directly in the
  # folder, is what this template says.
  placement:
    default: "{namespace}-{name}.yaml"
  # Nothing downstream supplies a namespace, so every namespaced document carries
  # its own. Unset would infer the same thing here; declaring it pins the folder's
  # convention so a later kustomization.yaml appearing beside it cannot change the
  # bytes of the next write. `true` is also what lets this folder hold TWO source
  # namespaces at all: the one-source-namespace rule binds only explicit `false`.
  serializeNamespace: true
