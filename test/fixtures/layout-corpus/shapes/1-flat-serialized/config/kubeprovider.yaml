# Required, because nothing mirrors through a KubeProvider without a grant. The
# WatchRule beside this file names source namespaces other than its own, so the
# grant gives the GitTargets in the provider's own namespace every source
# namespace ("*"). What those targets can actually read is bounded by the source
# credential's own RBAC.
apiVersion: configbutler.ai/v1alpha3
kind: KubeProvider
metadata:
  name: prod
  namespace: homelab-config
spec:
  # A kubeconfig Secret in this provider's own namespace.
  secretRef:
    name: prod-kubeconfig
  allowedGitTargets:
    - from: Same
      sourceNamespaces: ["*"]
