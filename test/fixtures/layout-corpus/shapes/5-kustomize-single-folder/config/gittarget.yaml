apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: checkout
  namespace: shop
spec:
  gitProviderRef:
    name: app-repository
  branch: main
  path: apps/checkout
  # Nothing else is declared, and that is the shape: the folder already has one
  # kustomization.yaml, so a new file is placed beside it, registered in its
  # resources:, and the root's namespace: shop is what lets the document omit its
  # own. Adopting an existing kustomize folder needs no configuration.
