apiVersion: configbutler.ai/v1alpha3
kind: GitBranch
metadata:
  name: app-repository-main
  namespace: shop
spec:
  gitProviderRef:
    name: app-repository
  branch: main
  allowedGitTargets:
    - consumerNamespaces: {from: Same}
---
# The same folder, when it does not exist yet. This is the ONLY difference
# between adopting a kustomize folder and creating one.
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: checkout
  namespace: shop
spec:
  gitBranchRef:
    name: app-repository-main
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  path: apps/checkout
  # There is nothing to infer from, so both halves are declared. useKustomize
  # writes the root; serializeNamespace: false is honest BECAUSE the operator owns
  # the root it wrote namespace: shop into.
  serializeNamespace: false
  placement:
    useKustomize: true
