apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: checkout-prod
  namespace: shop-prod
spec:
  providerRef:
    name: app-repository
  branch: main
  # A LEAF overlay, not the app root. One target = one overlay = one environment =
  # one write partition. apps/checkout would cover four roots at once, which is
  # LayoutResolved=Ambiguous, and would make the shared base writable from prod.
  path: apps/checkout/overlays/prod
  # Nothing declared: the overlay's own kustomization.yaml is the folder's one root,
  # it supplies namespace: shop-prod, and inference omits metadata.namespace.
