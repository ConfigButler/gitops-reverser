# Abridged live object. Everything here is what the overlay already renders EXCEPT the
# image tag, which someone changed in the cluster: 1.4.0 -> 1.5.0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: ghcr.io/example/checkout:1.5.0
          env:
            - name: LOG_LEVEL
              value: info
