apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutation-capture-lab
  namespace: mutation-capture-lab
  labels:
    app.kubernetes.io/name: mutation-capture-lab
spec:
  # One replica: the records live in this pod's memory, so every audit batch, admission review,
  # and watch event has to reach the same store.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mutation-capture-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mutation-capture-lab
    spec:
      serviceAccountName: mutation-capture-lab
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lab
          # The overlay sets the content-hashed tag; the image is imported into the node, never
          # pulled.
          image: mutation-capture-lab
          imagePullPolicy: Never
          args:
            - --admission-addr=:9443
            - --admission-cert-dir=/certs
            - --audit-addr=:9444
            - --audit-cert-dir=/certs
            # The API server presents a client certificate from the lab CA, and the audit
            # server refuses a connection without one, as a production receiver does.
            - --audit-client-ca=/certs/ca.crt
            - --api-addr=:8080
            # configmaps (rows 1-4, 8-13, 16-19), deployments (rows 5, 6), pods (row 7), the
            # two-version Widget CRD in its storage version v2 (row 14), and the wardle
            # aggregated API (row 15). A watch on a type that does not exist yet retries until
            # it does.
            - --watch-resources=v1/configmaps,apps/v1/deployments,v1/pods,mutationlab.configbutler.ai/v2/widgets,wardle.example.com/v1alpha1/flunders
          ports:
            - name: webhook
              containerPort: 9443
            - name: audit
              containerPort: 9444
            - name: api
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: mutation-capture-lab-tls
