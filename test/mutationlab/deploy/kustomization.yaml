apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The mutation-capture lab on its own cluster (docs/design/mutation-capture-lab-own-cluster.md).
# `task lab-bootstrap` applies this through an overlay in the lab's stamp directory, which adds
# the content-hashed image tag, the mutation-capture-lab-tls Secret issued by
# test/mutationlab/tools/lab-certs, and that CA as the registration's caBundle.
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - validating-webhook.yaml
