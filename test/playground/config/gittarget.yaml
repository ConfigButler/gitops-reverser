apiVersion: configbutler.ai/v1alpha3
kind: GitBranch
metadata:
  name: playground-provider-main
  namespace: tilt-playground
spec:
  gitProviderRef:
    name: playground-provider
  branch: main
  allowedGitTargets:
    - consumerNamespaces: {from: Same}
---
apiVersion: configbutler.ai/v1alpha3
kind: GitTarget
metadata:
  name: playground-target
  namespace: tilt-playground
spec:
  gitBranchRef:
    name: playground-provider-main
  kubeProviderRef:
    name: local
    namespace: gitops-reverser
  # Keep playground writes under a folder. Use "." only when testing repo-root ownership.
  path: live-cluster
  # Every event is its own commit, so a playground change shows up in Git immediately.
  commit:
    window:
      idleTimeout: "0s"
  encryption:
    provider: sops
    age:
      enabled: true
      recipients:
        extractFromSecret: true
    secretRef:
      name: sops-age-key
